      medium / xhigh，默认 xhigh）调节；reasoning_effort 与 thinking_budget 不能同时设置。仅在 Token Plan 订阅中提供，不支持按量计费；预览期至 2026-11-25 24:00（UTC+8），之后下线。价格与正式版
      qwen4-max 的刊例价一致（预览版本身不按 token 计费）。
    ja: 次世代フラッグシップのマルチモーダル Qwen プレビューモデルで、コーディング、オフィス業務、フロントエンド設計、複雑なエージェント作業に向きます。テキスト・画像・動画を入力でき、コンテキストは 1M、最大出力は約 384K（思考と回答で共有）です。思考は既定でオンで、reasoning_effort（low
      / medium / xhigh、既定は xhigh）で調整できます。reasoning_effort と thinking_budget は同時に指定できません。Token Plan のサブスクリプションでのみ提供され、従量課金は使えません。プレビュー期間は
      2026-11-25 24:00（UTC+8）までで、その後は終了します。価格は正式版 qwen4-max の定価と同じです（プレビュー自体は token 課金ではありません）。
    ko: 차세대 플래그십 멀티모달 Qwen 프리뷰 모델로, 코딩, 오피스 업무, 프런트엔드 디자인, 복잡한 에이전트 작업에 적합합니다. 텍스트·이미지·동영상 입력을 지원하며 컨텍스트는 1M, 최대 출력은 약 384K(사고와
      답변이 공유)입니다. 사고는 기본으로 켜져 있고 reasoning_effort(low / medium / xhigh, 기본값 xhigh)로 조절할 수 있습니다. reasoning_effort와 thinking_budget은
      동시에 설정할 수 없습니다. Token Plan 구독으로만 제공되며 종량제는 지원하지 않습니다. 프리뷰 기간은 2026-11-25 24:00(UTC+8)까지이며 이후 종료됩니다. 가격은 정식판 qwen4-max의
