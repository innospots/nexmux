  description:
    en: Anthropic's model built for demanding reasoning and long-horizon agentic work. It has a 1M context window and a 128K
      synchronous max output. Adaptive thinking is always on and cannot be turned off; the default effort is high, and supported
      values are low, medium, high, xhigh, and max. Setting thinking to disabled or sending budget_tokens returns 400. Forced
      tool_choice values any and tool return 400; use auto or none. Non-default temperature, top_p, and top_k return 400.
      人民币价为美元刊例价 ×7 的换算占位价，非官方人民币刊例。
    zh-CN: 面向高要求推理与长程 Agent 工作的 Anthropic 模型。上下文 1M，同步最大输出 128K。自适应思考始终开启且不能关闭，默认 effort 为 high，支持 low、medium、high、xhigh 和
      max。thinking 设为 disabled，或手动传入 budget_tokens，会返回 400。tool_choice 的 any 与 tool 会返回 400，应使用 auto 或 none。非默认的 temperature、top_p、top_k
      也会返回 400。人民币价为美元刊例价 ×7 的换算占位价，非官方人民币刊例。
