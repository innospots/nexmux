  description:
    en: 'A compact all-modal Doubao model for deep thinking across text, image, video, and audio. Successor to doubao-seed-2-0-mini-260215.
      Context window is 256K, maximum input is 224K, and maximum answer is 128K. Official audio-input list prices are not
      stored in this preset: CNY 3 / 6 / 12 per million tokens (cache hit 0.6 / 1.2 / 2.4) for input up to 32K / 128K / 256K;
      USD 1.50 / 3.00 (cache hit 0.30 / 0.60) for input up to 128K / 256K.'
    zh-CN: 面向文本、图像、视频与音频的紧凑全模态豆包模型，支持深度思考，继任即将下线的 doubao-seed-2-0-mini-260215。上下文窗口 256K，最大输入 224K，最大回答 128K。音频输入刊例价未写入价格档：人民币
      3 / 6 / 12 元每百万 token（缓存命中 0.6 / 1.2 / 2.4，对应输入不超过 32K / 128K / 256K）；美元 1.50 / 3.00（缓存命中 0.30 / 0.60，对应输入不超过 128K /
      256K）。
    ja: テキスト、画像、動画、音声を扱う小型のオムニモーダル Doubao で、深い思考に対応します。まもなく終了する doubao-seed-2-0-mini-260215 の後継です。コンテキストは 256K、入力の上限は 224K、回答の上限は
      128K です。音声入力の定価は料金ティアに入れていません。人民元は100万トークンあたり 3 / 6 / 12 元（キャッシュヒット 0.6 / 1.2 / 2.4。入力が 32K / 128K / 256K 以下のとき）。米ドルは
      1.50 / 3.00（キャッシュヒット 0.30 / 0.60。入力が 128K / 256K 以下のとき）です。
    ko: 텍스트, 이미지, 영상, 오디오를 다루는 소형 옴니모달 Doubao로, 깊은 사고를 지원합니다. 곧 종료되는 doubao-seed-2-0-mini-260215의 후속입니다. 컨텍스트는 256K, 입력 상한은
      224K, 답변 상한은 128K입니다. 오디오 입력 정가는 가격 구간에 넣지 않았습니다. 위안화는 100만 토큰당 3 / 6 / 12위안(캐시 적중 0.6 / 1.2 / 2.4, 입력이 32K / 128K /
      256K 이하일 때)입니다. 미국 달러는 1.50 / 3.00(캐시 적중 0.30 / 0.60, 입력이 128K / 256K 이하일 때)입니다.
