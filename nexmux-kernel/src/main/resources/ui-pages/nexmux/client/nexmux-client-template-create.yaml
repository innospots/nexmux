dsl: "1.0"
page:
  id: nexmux-client-template-create
  title: 新建客户端模板
  name: nexmuxClientTemplateCreate
  description: 创建或修改客户端模板：基本信息、路由授权、配额与限流策略
meta:
  apiBase: /api/nexmux
  priority: P1
  routePath: /page/nexmux/client/nexmux-client-template-create
state:
  record:
    authRoutes: []
    quotas: []
    rateLimits: []
    tags: []
  validityType: days
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 访问治理
          - label: 客户端模板
            href: /client-templates
          - label: 新增
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: small
          children:
            - type: Typography
              props:
                variant: h3
                text: 新建客户端模板
            - type: Typography
              props:
                variant: muted
                text: 预置路由、配额与限流；保存后可基于模板创建客户端（创建时生成 AppKey）。模板本身不含 AppKey。
    - type: Form
      props:
        layout: vertical
        initialValues:
          validityType: days
      events:
        onSubmit:
          - action: message
            params:
              messageType: success
              text: 客户端模板「${event.name}」已创建并启用（演示）
          - action: navigate
            params:
              to: /client-templates
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            - type: Card
              props:
                title: ① 基本信息
              children:
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                    className: "[&>[data-slot=grid-item]:last-child]:col-span-full"
                  children:
                    - type: Field
                      props:
                        label: 名称
                        required: true
                      children:
                        - type: Input
                          props:
                            name: name
                            className: w-full
                            placeholder: 展示名，如 agent-default
                            rules:
                              - required: true
                                message: 请输入模板名称
                    - type: Field
                      children:
                        - type: Flex
                          props:
                            justify: space-between
                            align: center
                            className: w-full mb-3.5
                          children:
                            - type: Flex
                              props:
                                align: center
                                className: gap-0.5
                              children:
                                - type: Text
                                  props:
                                    text: "*"
                                    className: text-destructive text-sm leading-none
                                - type: Label
                                  props:
                                    text: 标识
                            - type: Text
                              props:
                                text: 模板标识 创建后不可修改
                                type: secondary
                                className: text-xs leading-none
                        - type: Input
                          props:
                            name: code
                            className: w-full
                            placeholder: 小写 + 数字 + 连字符，如 agent-default
                            disabled: false
                            rules:
                              - required: true
                                message: 请输入模板标识
                    - type: Field
                      props:
                        label: 有效期
                        required: true
                      children:
                        - type: RadioGroup
                          props:
                            name: validityType
                            direction: horizontal
                            options:
                              - label: 创建后 N 天
                                value: days
                              - label: 固定日期
                                value: fixed
                              - label: 永不过期
                                value: never
                            className: mt-2
                          events:
                            onChange:
                              - action: setState
                                params:
                                  validityType: ${event}
                        - type: NumberInput
                          when: ${state.validityType == 'days'}
                          props:
                            name: validityDays
                            className: w-48 mt-2
                            min: 1
                            precision: 0
                            placeholder: 天数，如 365
                            rules:
                              - required: true
                                message: 请输入天数
                        - type: DatePicker
                          when: ${state.validityType == 'fixed'}
                          props:
                            name: validityFixedDate
                            className: w-56 mt-2
                            placeholder: 请选择固定日期
                            rules:
                              - required: true
                                message: 请选择固定日期
                    - type: Field
                      props:
                        label: 标签
                      children:
                        - type: Input
                          props:
                            name: tags
                            className: w-full
                            placeholder: 逗号分隔：agent, team-default
                    - type: Field
                      props:
                        label: 描述
                      children:
                        - type: Textarea
                          props:
                            name: description
                            className: w-full
                            rows: 3
                            placeholder: 模板用途说明（可选）
            - type: Card
              props:
                title: ③ 路由授权
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: center
                  children:
                    - type: Text
                      props:
                        text: 未授权 Route 拒绝调用。
                        type: secondary
                    - type: Button
                      props:
                        text: + 添加路由
                        size: small
                      events:
                        onClick:
                          - id: addRoute
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: 添加路由授权
                                width: 640
                                content:
                                  type: Flex
                                  props:
                                    direction: vertical
                                    gap: middle
                                    align: stretch
                                  children:
                                    - type: Field
                                      props:
                                        label: 搜索
                                      children:
                                        - type: Input
                                          props:
                                            className: w-full
                                            placeholder: 路由名称 / 标识（演示）
                                    - type: Flex
                                      props:
                                        direction: vertical
                                        gap: small
                                        align: stretch
                                      children:
                                        - type: Text
                                          props:
                                            text: 可选路由（仅已启用）
                                            type: secondary
                                        - type: Flex
                                          props:
                                            align: center
                                            gap: middle
                                          children:
                                            - type: Checkbox
                                              props:
                                                value: false
                                            - type: Text
                                              props:
                                                text: coding-assistant
                                                style:
                                                  width: 160
                                            - type: Text
                                              props:
                                                text: coding
                                                type: secondary
                                                style:
                                                  width: 90
                                            - type: Text
                                              props:
                                                text: 单模型
                                                type: secondary
                                                style:
                                                  width: 80
                                            - type: Text
                                              props:
                                                text: /v1/chat/completions
                                                type: secondary
                                        - type: Flex
                                          props:
                                            align: center
                                            gap: middle
                                          children:
                                            - type: Checkbox
                                              props:
                                                value: false
                                            - type: Text
                                              props:
                                                text: embeddings-std
                                                style:
                                                  width: 160
                                            - type: Text
                                              props:
                                                text: embedding
                                                type: secondary
                                                style:
                                                  width: 90
                                            - type: Text
                                              props:
                                                text: 单模型
                                                type: secondary
                                                style:
                                                  width: 80
                                            - type: Text
                                              props:
                                                text: /v1/embeddings
                                                type: secondary
                                        - type: Flex
                                          props:
                                            align: center
                                            gap: middle
                                          children:
                                            - type: Checkbox
                                              props:
                                                value: false
                                            - type: Text
                                              props:
                                                text: mobile-lite
                                                style:
                                                  width: 160
                                            - type: Text
                                              props:
                                                text: chat-lite
                                                type: secondary
                                                style:
                                                  width: 90
                                            - type: Text
                                              props:
                                                text: 多模型池
                                                type: secondary
                                                style:
                                                  width: 80
                                            - type: Text
                                              props:
                                                text: /v1/chat/completions
                                                type: secondary
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: middle
                                      children:
                                        - type: Button
                                          props:
                                            text: 取消
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: 确认添加
                                            variant: primary
                                          events:
                                            onClick:
                                              - action: overlay.close
                                              - action: message
                                                params:
                                                  messageType: success
                                                  text: 已添加路由授权（演示）
                - type: Table
                  props:
                    dataSource: ${state.record.authRoutes}
                    rowKey: code
                    pagination: false
                    className: mt-2
                    columns:
                      - title: 路由名称
                        cell:
                          type: Button
                          props:
                            text: ${row.name}
                            variant: link
                            size: small
                            className: p-0 h-auto
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /routes/${row.code}
                      - title: Alias
                        dataIndex: alias
                      - title: 类型
                        dataIndex: typeLabel
                      - title: 请求路径
                        dataIndex: path
                      - title: 操作
                        align: center
                        width: 80
                        cell:
                          type: Button
                          props:
                            text: 移除
                            variant: link
                            size: small
                            danger: true
                          events:
                            onClick:
                              - id: removeRouteCfm
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: 确认移除路由授权
                                    width: 480
                                    content:
                                      type: Flex
                                      props:
                                        direction: vertical
                                        gap: middle
                                      children:
                                        - type: Text
                                          props:
                                            size: small
                                            text: 移除后，该主体对「${row.name}」（${row.path}）的调用将被拒绝；重新添加授权即可恢复。
                                        - type: Flex
                                          props:
                                            justify: end
                                            gap: middle
                                          children:
                                            - type: Button
                                              props:
                                                text: 取消
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                            - type: Button
                                              props:
                                                text: 确认移除
                                                variant: primary
                                                danger: true
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                                    params:
                                                      payload:
                                                        ok: true
                              - action: if
                                params:
                                  condition: ${actions.removeRouteCfm.ok}
                                  then:
                                    - action: message
                                      params:
                                        messageType: success
                                        text: 已移除路由授权（演示）
                - type: Text
                  when: ${state.record.authRoutes.length == 0}
                  props:
                    text: 尚未授权路由；未授权 Route 拒绝调用。
                    type: secondary
            - type: Card
              props:
                title: ④ 配额策略
              children:
                - type: Flex
                  props:
                    direction: vertical
                    gap: middle
                    align: stretch
                  children:
                    - type: Flex
                      props:
                        justify: space-between
                        align: center
                      children:
                        - type: Text
                          props:
                            text: 可配置多条；总配额与周期循环可并存。
                            type: secondary
                        - type: Button
                          props:
                            text: + 添加配额规则
                            size: small
                          events:
                            onClick:
                              - id: addQuota
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: 添加配额规则
                                    width: 560
                                    content:
                                      type: Form
                                      props:
                                        name: quotaRule
                                        initialValues:
                                          quotaType: lifetime
                                          metric: TOTAL_TOKEN
                                          cycle: hour24
                                          mode: soft
                                      events:
                                        onSubmit:
                                          - action: overlay.close
                                          - action: message
                                            params:
                                              messageType: success
                                              text: 配额规则已保存（演示）
                                      children:
                                        - type: Flex
                                          props:
                                            direction: vertical
                                            gap: middle
                                            align: stretch
                                          children:
                                            - type: Field
                                              props:
                                                label: 规则名称
                                                required: true
                                              children:
                                                - type: Input
                                                  props:
                                                    name: name
                                                    className: w-full
                                                    placeholder: 如 daily-token-cap
                                                    rules:
                                                      - required: true
                                                        message: 请输入规则名称
                                            - type: Field
                                              props:
                                                label: 配额类型
                                                required: true
                                              children:
                                                - type: RadioGroup
                                                  props:
                                                    name: quotaType
                                                    direction: horizontal
                                                    options:
                                                      - label: 总配额
                                                        value: lifetime
                                                      - label: 周期循环配额
                                                        value: cyclic
                                            - type: Field
                                              props:
                                                label: 计量指标
                                                required: true
                                              children:
                                                - type: Select
                                                  props:
                                                    name: metric
                                                    className: w-full
                                                    options:
                                                      - label: Request
                                                        value: REQUEST
                                                      - label: Input Token
                                                        value: INPUT_TOKEN
                                                      - label: Output Token
                                                        value: OUTPUT_TOKEN
                                                      - label: Total Token
                                                        value: TOTAL_TOKEN
                                                      - label: Cost
                                                        value: COST
                                                      - label: Concurrent
                                                        value: CONCURRENT
                                            - type: Field
                                              props:
                                                label: 上限
                                                required: true
                                              children:
                                                - type: NumberInput
                                                  props:
                                                    name: limit
                                                    className: w-full
                                                    min: 1
                                                    precision: 0
                                                    placeholder: 如 500000
                                                    rules:
                                                      - required: true
                                                        message: 请输入上限
                                            - type: Field
                                              props:
                                                label: 循环周期（仅周期循环配额）
                                              children:
                                                - type: RadioGroup
                                                  props:
                                                    name: cycle
                                                    direction: vertical
                                                    options:
                                                      - label: 每 24 小时
                                                        value: hour24
                                                      - label: 每 7 天
                                                        value: day7
                                                      - label: 每月（自然月，每月 1 日 00:00 重置）
                                                        value: month
                                            - type: Field
                                              props:
                                                label: 模式
                                                required: true
                                              children:
                                                - type: Select
                                                  props:
                                                    name: mode
                                                    className: w-full
                                                    options:
                                                      - label: Soft Limit
                                                        value: soft
                                                      - label: Hard Limit
                                                        value: hard
                                            - type: Flex
                                              props:
                                                justify: end
                                                gap: middle
                                              children:
                                                - type: Button
                                                  props:
                                                    text: 取消
                                                  events:
                                                    onClick:
                                                      - action: overlay.close
                                                - type: Button
                                                  props:
                                                    text: 保存
                                                    variant: primary
                                                    submit: true
                    - type: Card
                      when: ${state.record.quotas[0] != null}
                      props:
                        size: small
                      children:
                        - type: Flex
                          props:
                            direction: vertical
                            gap: small
                            align: stretch
                          children:
                            - type: Flex
                              props:
                                align: baseline
                                gap: middle
                              children:
                                - type: Text
                                  props:
                                    text: 规则名称
                                    type: secondary
                                    style:
                                      width: 120
                                      flexShrink: 0
                                - type: Text
                                  props:
                                    text: ${state.record.quotas[0].name}
                            - type: Flex
                              props:
                                align: baseline
                                gap: middle
                              children:
                                - type: Text
                                  props:
                                    text: 配额类型
                                    type: secondary
                                    style:
                                      width: 120
                                      flexShrink: 0
                                - type: Text
                                  props:
                                    text: ${state.record.quotas[0].quotaTypeLabel}
                            - type: Flex
                              props:
                                align: baseline
                                gap: middle
                              children:
                                - type: Text
                                  props:
                                    text: 计量指标
                                    type: secondary
                                    style:
                                      width: 120
                                      flexShrink: 0
                                - type: Text
                                  props:
                                    text: ${state.record.quotas[0].metricLabel}
                            - type: Flex
                              props:
                                align: baseline
                                gap: middle
                              children:
                                - type: Text
                                  props:
                                    text: 上限
                                    type: secondary
                                    style:
                                      width: 120
                                      flexShrink: 0
                                - type: Text
                                  props:
                                    text: ${state.record.quotas[0].limitText}
                            - type: Flex
                              when: ${state.record.quotas[0].quotaType == 'cyclic'}
                              props:
                                align: baseline
                                gap: middle
                              children:
                                - type: Text
                                  props:
                                    text: 循环周期
                                    type: secondary
                                    style:
                                      width: 120
                                      flexShrink: 0
                                - type: Text
                                  props:
                                    text: ${state.record.quotas[0].cycleLabel}
                            - type: Flex
                              props:
                                align: baseline
                                gap: middle
                              children:
                                - type: Text
                                  props:
                                    text: 模式
                                    type: secondary
                                    style:
                                      width: 120
                                      flexShrink: 0
                                - type: Text
                                  props:
                                    text: ${state.record.quotas[0].modeLabel}
                            - type: Flex
                              props:
                                justify: space-between
                                align: center
                              children:
                                - type: StatusBadge
                                  props:
                                    status: ${state.record.quotas[0].status}
                                - type: Flex
                                  props:
                                    gap: small
                                  children:
                                    - type: Button
                                      props:
                                        text: 编辑
                                        size: small
                                      events:
                                        onClick:
                                          - id: editQuota
                                            action: overlay.open
                                            params:
                                              overlay:
                                                type: modal
                                                title: 编辑配额规则
                                                width: 560
                                                content:
                                                  type: Form
                                                  props:
                                                    name: quotaRule
                                                    initialValues:
                                                      quotaType: lifetime
                                                      metric: TOTAL_TOKEN
                                                      cycle: hour24
                                                      mode: soft
                                                  events:
                                                    onSubmit:
                                                      - action: overlay.close
                                                      - action: message
                                                        params:
                                                          messageType: success
                                                          text: 配额规则已更新（演示）
                                                  children:
                                                    - type: Flex
                                                      props:
                                                        direction: vertical
                                                        gap: middle
                                                        align: stretch
                                                      children:
                                                        - type: Field
                                                          props:
                                                            label: 规则名称
                                                            required: true
                                                          children:
                                                            - type: Input
                                                              props:
                                                                name: name
                                                                className: w-full
                                                                placeholder: 如 daily-token-cap
                                                                rules:
                                                                  - required: true
                                                                    message: 请输入规则名称
                                                                value: ${state.record.quotas[0].name}
                                                        - type: Field
                                                          props:
                                                            label: 配额类型
                                                            required: true
                                                          children:
                                                            - type: RadioGroup
                                                              props:
                                                                name: quotaType
                                                                direction: horizontal
                                                                options:
                                                                  - label: 总配额
                                                                    value: lifetime
                                                                  - label: 周期循环配额
                                                                    value: cyclic
                                                                value: ${state.record.quotas[0].quotaType}
                                                        - type: Field
                                                          props:
                                                            label: 计量指标
                                                            required: true
                                                          children:
                                                            - type: Select
                                                              props:
                                                                name: metric
                                                                className: w-full
                                                                options:
                                                                  - label: Request
                                                                    value: REQUEST
                                                                  - label: Input Token
                                                                    value: INPUT_TOKEN
                                                                  - label: Output Token
                                                                    value: OUTPUT_TOKEN
                                                                  - label: Total Token
                                                                    value: TOTAL_TOKEN
                                                                  - label: Cost
                                                                    value: COST
                                                                  - label: Concurrent
                                                                    value: CONCURRENT
                                                                value: ${state.record.quotas[0].metric}
                                                        - type: Field
                                                          props:
                                                            label: 上限
                                                            required: true
                                                          children:
                                                            - type: NumberInput
                                                              props:
                                                                name: limit
                                                                className: w-full
                                                                min: 1
                                                                precision: 0
                                                                placeholder: 如 500000
                                                                rules:
                                                                  - required: true
                                                                    message: 请输入上限
                                                                value: ${state.record.quotas[0].limit}
                                                        - type: Field
                                                          props:
                                                            label: 循环周期（仅周期循环配额）
                                                          children:
                                                            - type: RadioGroup
                                                              props:
                                                                name: cycle
                                                                direction: vertical
                                                                options:
                                                                  - label: 每 24 小时
                                                                    value: hour24
                                                                  - label: 每 7 天
                                                                    value: day7
                                                                  - label: 每月（自然月，每月 1 日 00:00 重置）
                                                                    value: month
                                                                value: "${state.record.quotas[0].cycleUnit == 'month' ? 'month' :
                                                                  state.record.quotas\
                                                                  [0].cycleUnit ==
                                                                  'day' ? 'day7' :
                                                                  'hour24'}"
                                                        - type: Field
                                                          props:
                                                            label: 模式
                                                            required: true
                                                          children:
                                                            - type: Select
                                                              props:
                                                                name: mode
                                                                className: w-full
                                                                options:
                                                                  - label: Soft Limit
                                                                    value: soft
                                                                  - label: Hard Limit
                                                                    value: hard
                                                                value: ${state.record.quotas[0].mode}
                                                        - type: Flex
                                                          props:
                                                            justify: end
                                                            gap: middle
                                                          children:
                                                            - type: Button
                                                              props:
                                                                text: 取消
                                                              events:
                                                                onClick:
                                                                  - action: overlay.close
                                                            - type: Button
                                                              props:
                                                                text: 保存
                                                                variant: primary
                                                                submit: true
                                    - type: Button
                                      props:
                                        text: 删除
                                        size: small
                                        danger: true
                                      events:
                                        onClick:
                                          - id: delQuotaCfm
                                            action: overlay.open
                                            params:
                                              overlay:
                                                type: modal
                                                title: 确认删除配额规则
                                                width: 480
                                                content:
                                                  type: Flex
                                                  props:
                                                    direction: vertical
                                                    gap: middle
                                                  children:
                                                    - type: Text
                                                      props:
                                                        size: small
                                                        text: 删除后，配额规则「${state.record.quotas[0].name}」将立即失效且不可恢复。
                                                    - type: Flex
                                                      props:
                                                        justify: end
                                                        gap: middle
                                                      children:
                                                        - type: Button
                                                          props:
                                                            text: 取消
                                                          events:
                                                            onClick:
                                                              - action: overlay.close
                                                        - type: Button
                                                          props:
                                                            text: 确认删除
                                                            variant: primary
                                                            danger: true
                                                          events:
                                                            onClick:
                                                              - action: overlay.close
                                                                params:
                                                                  payload:
                                                                    ok: true
                                          - action: if
                                            params:
                                              condition: ${actions.delQuotaCfm.ok}
                                              then:
                                                - action: message
                                                  params:
                                                    messageType: success
                                                    text: 已删除配额规则（演示）
                    - type: Card
                      when: ${state.record.quotas[1] != null}
                      props:
                        size: small
                      children:
                        - type: Flex
                          props:
                            direction: vertical
                            gap: small
                            align: stretch
                          children:
                            - type: Flex
                              props:
                                align: baseline
                                gap: middle
                              children:
                                - type: Text
