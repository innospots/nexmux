dsl: "1.0"
page:
  id: nexmux-client-template-list
  title: 客户端模板
  name: nexmuxClientTemplateList
  description: 访问治理 / 客户端模板：预置路由、配额与限流的策略预设（卡片式列表）
meta:
  apiBase: /api/d
  priority: P1
  routePath: /page/nexmux/client/nexmux-client-template-list
state:
  keyword: ""
  statusChip: all
  tagChips: []
dataSources:
  templates:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /client-templates
      params:
        status: ${state.statusChip}
        keyword: ${state.keyword}
        tags: ${state.tagChips}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 访问治理
          - label: 客户端模板
    - type: Flex
      props:
        align: baseline
        gap: middle
      children:
        - type: Typography
          props:
            variant: h3
            text: 客户端模板
        - type: Typography
          props:
            variant: muted
            text: 预置路由、配额与限流；基于模板创建客户端（含 AppKey）。
    - type: Card
      children:
        - type: Flex
          props:
            align: center
            gap: small
            style:
              flexWrap: wrap
          children:
            - type: Text
              props:
                text: 状态
                strong: true
                className: w-10
            - type: ChipFilter
              props:
                mode: single
                value: ${state.statusChip}
                items: ${data.templates.filters.status}
              events:
                onChange:
                  - action: setState
                    params:
                      statusChip: ${event}
                  - action: reload
                    params:
                      dataSource: templates
        - type: Flex
          props:
            align: center
            gap: small
            style:
              flexWrap: wrap
            className: mt-2
          children:
            - type: Text
              props:
                text: 标签
                strong: true
                className: w-10
            - type: ChipFilter
              props:
                mode: multi
                value: ${state.tagChips}
                items: ${data.templates.filters.tags}
              events:
                onChange:
                  - action: setState
                    params:
                      tagChips: ${event}
                  - action: reload
                    params:
                      dataSource: templates
        - type: Flex
          props:
            align: center
            gap: small
            className: mt-2
          children:
            - type: Text
              props:
                text: 搜索
                strong: true
                className: w-10
            - type: Flex
              props:
                align: center
                gap: small
                className: h-9 rounded-md border bg-background px-3
                style:
                  flex: 1
              children:
                - type: Icon
                  props:
                    name: search
                    className: text-muted-foreground
                - type: Input
                  props:
                    value: ${state.keyword}
                    placeholder: 模板名称 / 标识
                    className: border-0 bg-transparent px-0 shadow-none focus-visible:ring-0
                    style:
                      flex: 1
                  events:
                    onChange:
                      - action: setState
                        params:
                          keyword: ${event}
                      - action: reload
                        params:
                          dataSource: templates
            - type: Text
              props:
                text: 显示 ${data.templates.items.length} / ${data.templates.total}
                type: secondary
                className: tabular-nums text-sm
    - type: Grid
      props:
        columns: 3
        gap: 16
      children:
        - type: Card
          props:
            className: border-dashed h-full bg-(--muted) border-2
              border-[color-mix(in_srgb,var(--foreground)_30%,transparent)]
              [&_[data-slot=card-content]]:h-full
          children:
            - type: Flex
              props:
                direction: vertical
                gap: large
                align: stretch
                justify: space-between
                className: h-full
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        justify: center
                        className: size-10 shrink-0 rounded-full bg-primary
                      children:
                        - type: Icon
                          props:
                            name: plus
                            size: 28
                            color: var(--primary-foreground)
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 2
                      children:
                        - type: Text
                          props:
                            text: 新建模板
                            strong: true
                            className: text-base
                        - type: Text
                          props:
                            text: 预置路由、配额与限流，不含 AppKey
                            type: secondary
                            className: text-sm
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Button
                      props:
                        text: 新建模板
                        icon: plus
                        variant: primary
                        style:
                          flex: 1
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /client-templates/new
        - type: TemplateCardLink
          when: ${data.templates.items[0] != null}
          props:
            href: /client-templates/${data.templates.items[0].code}
          children:
            - type: Card
              props:
                className: h-full model-card relative
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        justify: center
                        className: size-14 shrink-0 rounded-full bg-(--muted)
                      children:
                        - type: Icon
                          props:
                            name: bookmark
                            size: 28
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 0
                        style:
                          alignItems: flex-start
                      children:
                        - type: Button
                          props:
                            text: ${data.templates.items[0].name}
                            variant: link
                            className: p-0 font-semibold text-base
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /client-templates/${data.templates.items[0].code}
                        - type: Text
                          props:
                            text: ${data.templates.items[0].code}
                            type: secondary
                            className: text-sm
                - type: Flex
                  props:
                    align: center
                    gap: 2
                    className: absolute right-3 top-3 model-card-actions
                  children:
                    - type: Tooltip
                      props:
                        content: "${data.templates.items[0].status == 'enabled' ? '停用' : '启用'}"
                      children:
                        - type: Button
                          props:
                            variant: text
                            size: small
                            className: size-6 p-0
                          children:
                            - type: StatusToggleIcon
                              props:
                                enabled: ${data.templates.items[0].status == 'enabled'}
                          events:
                            onClick:
                              - id: statusCfm
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: "${data.templates.items[0].status == 'enabled' ? '确认停用模板' : '确认启用模板'}"
                                    width: 480
                                    content:
                                      type: Flex
                                      props:
                                        direction: vertical
                                        gap: middle
                                      children:
                                        - type: Text
                                          props:
                                            size: small
                                            text: "${data.templates.items[0].status == 'enabled' ?
                                              '停用后，不可基于该模板创建客户端；已创建客户端的调用不受影响。'
                                              : '启用后，可基于该模板创建客户端（创建时生成
                                              AppKey）。'}"
                                        - type: Flex
                                          props:
                                            direction: vertical
                                            gap: small
                                          children:
                                            - type: Text
                                              props:
                                                text: 影响范围：
                                                strong: true
                                            - type: Text
                                              props:
                                                text: · 已创建客户端：${data.templates.items[0].createdClientCount} 个
                                                type: secondary
                                            - type: Text
                                              props:
                                                text: · 授权路由：${data.templates.items[0].routeCount} 条
                                                type: secondary
                                        - type: Text
                                          when: ${data.templates.items[0].status == 'enabled' &&
                                            data.templates.items[0].createdClientCount
                                            > 0}
                                          props:
                                            size: small
                                            text: ⚠ 停用仅阻止基于模板新建客户端，不回溯已创建的客户端。
                                            type: warning
                                        - type: Flex
                                          props:
                                            justify: end
                                            gap: middle
                                          children:
                                            - type: Button
                                              props:
                                                text: 取消
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                            - type: Button
                                              props:
                                                text: "${data.templates.items[0].status == 'enabled' ? '确认停用' : '确认启用'}"
                                                variant: primary
                                                danger: ${data.templates.items[0].status == 'enabled'}
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                                    params:
                                                      payload:
                                                        ok: true
                              - action: if
                                params:
                                  condition: ${actions.statusCfm.ok}
                                  then:
                                    - action: message
                                      params:
                                        messageType: success
                                        text: "${data.templates.items[0].status == 'enabled' ? '已停用' :
                                          '已启用'}（演示：静态页面不落库）"
                    - type: Tooltip
                      props:
                        content: 编辑
                      children:
                        - type: Button
                          props:
                            icon: pencil
                            variant: text
                            size: small
                            className: size-6 p-0
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /client-templates/${data.templates.items[0].code}/edit
                - type: Flex
                  props:
                    align: center
                    gap: small
                    style:
                      flexWrap: wrap
                  children:
                    - type: Badge
                      when: ${data.templates.items[0].tags[0] != null}
                      props:
                        text: ${data.templates.items[0].tags[0]}
                        variant: outline
                    - type: Badge
                      when: ${data.templates.items[0].tags[1] != null}
                      props:
                        text: ${data.templates.items[0].tags[1]}
                        variant: outline
                    - type: Badge
                      when: ${data.templates.items[0].tags[2] != null}
                      props:
                        text: ${data.templates.items[0].tags[2]}
                        variant: outline
                    - type: Text
                      when: ${data.templates.items[0].tags.length > 3}
                      props:
                        text: +${data.templates.items[0].tags.length - 3}
                        type: secondary
                    - type: Text
                      when: ${data.templates.items[0].tags.length == 0}
                      props:
                        text: —
                        type: secondary
                - type: Text
                  props:
                    text: ${data.templates.items[0].policySummary}
                    type: secondary
                    className: text-sm
                - type: Flex
                  props:
                    justify: space-between
                    align: center
                  children:
                    - type: Text
                      props:
                        text: 有效期 ${data.templates.items[0].validityLabel}
                        type: secondary
                        className: text-sm
                    - type: Text
                      props:
                        text: 已创建 ${data.templates.items[0].createdClientCount} 个客户端
                        type: secondary
                        className: tabular-nums text-sm
        - type: TemplateCardLink
