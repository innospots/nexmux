dsl: "1.0"
page:
  id: nexmux-model-edit
  title: 编辑模型
  name: nexmuxModelEdit
  description: 创建或修改 Model：基本信息、默认参数与分档定价
meta:
  apiBase: /api/nexmux
  priority: P0
  routePath: /page/nexmux/model/nexmux-model-edit
dataSources:
  detail:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /models/${route.params.code}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 模型资产
          - label: 模型
            href: /models
          - label: ${data.detail.name}
            href: /models/${route.params.code}
          - label: 编辑
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: small
          children:
            - type: Typography
              props:
                variant: h3
                text: 编辑模型 — ${data.detail.name}
            - type: Typography
              props:
                variant: muted
                text: 定义对客户端暴露的模型：基本信息、默认执行参数与分档定价
    - type: Form
      when: ${data.detail != null}
      props:
        layout: vertical
        initialValues:
          code: ${data.detail.code}
          name: ${data.detail.name}
          providerCode: ${data.detail.providerCode}
          providerModelId: ${data.detail.primaryUpstreamId}
          type: ${data.detail.type}
          releaseDate: ${data.detail.releaseDate}
          contextWindow: ${data.detail.contextWindow}
          maxTokens: "${data.detail.maxTokens > 0 ? data.detail.maxTokens : null}"
          inputModalities: ${data.detail.inputModalitiesText}
          outputModalities: ${data.detail.outputModalitiesText}
          tags: ${data.detail.tagsText}
          description: ${data.detail.description}
          metadata: ${data.detail.metadata}
          status: ${data.detail.status}
          temperature: ${data.detail.params.temperature}
          topP: ${data.detail.params.topP}
          topK: ${data.detail.params.topK}
          maxTokensParam: ${data.detail.params.maxTokens}
          frequencyPenalty: ${data.detail.params.frequencyPenalty}
          presencePenalty: ${data.detail.params.presencePenalty}
          reasoningEffort: ${data.detail.params.reasoningEffort}
          seed: ${data.detail.params.seed}
          stopSequences: ${data.detail.params.stopSequences}
          responseFormat: ${data.detail.params.responseFormat}
          capabilities: ${data.detail.params.capabilities}
          currency: ${data.detail.currency}
      events:
        onSubmit:
          - id: cfm
            action: confirm
            condition: ${event.status == 'disabled'}
            params:
              title: 确认停用 Model
              content: 停用后，该模型将不再参与路由调度。⚠ 存在活跃路由引用时，建议先完成切换再停用。（演示）
          - action: if
            params:
              condition: ${event.status != 'disabled' || actions.cfm}
              then:
                - action: message
                  params:
                    messageType: success
                    text: 模型已保存（演示：静态页面不落库）
                - action: navigate
                  params:
                    to: /models/${route.params.code}
      children:
        - type: Card
          children:
            - type: Tabs
              props:
                variant: line
                items:
                  - key: basic
                    label: 基本信息
                    className: p-2 pt-4
                    children:
                      - type: Grid
                        props:
                          columns: 2
                          gap: 16
                        children:
                          - type: Field
                            children:
                              - type: Flex
                                props:
                                  justify: space-between
                                  align: center
                                  className: w-full
                                children:
                                  - type: Flex
                                    props:
                                      align: center
                                      className: gap-0.5
                                    children:
                                      - type: Text
                                        props:
                                          text: "*"
                                          className: text-destructive text-sm leading-none
                                      - type: Label
                                        props:
                                          text: Model Code
                                  - type: Text
                                    props:
                                      text: Model Code 创建后不可修改
                                      type: secondary
                                      className: text-xs leading-none
                              - type: Input
                                props:
                                  name: code
                                  className: w-full
                                  placeholder: 小写 + 数字 + 连字符，如 qwen3-vl-plus
                                  disabled: true
                                  rules:
                                    - required: true
                                      message: 请输入 Model Code
                          - type: Field
                            props:
                              label: Model Name
                              required: true
                            children:
                              - type: Input
                                props:
                                  name: name
                                  className: w-full
                                  placeholder: 展示名，如 Qwen3-VL Plus
                                  rules:
                                    - required: true
                                      message: 请输入 Model Name
                          - type: Field
                            props:
                              label: Provider
                              required: true
                            children:
                              - type: Select
                                props:
                                  name: providerCode
                                  className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                                  options:
                                    - label: OpenAI
                                      value: openai
                                    - label: Azure OpenAI
                                      value: azure-openai
                                    - label: Anthropic
                                      value: anthropic
                                    - label: 阿里云百炼
                                      value: dashscope
                                    - label: DeepSeek (2)
                                      value: deepseek
                                  rules:
                                    - required: true
                                      message: 请选择 Provider
                          - type: Field
                            props:
                              label: Provider Model Name
                              required: true
                            children:
                              - type: Input
                                props:
                                  name: providerModelId
                                  className: w-full
                                  placeholder: 上游 API 实际调用的模型 ID
                                  rules:
                                    - required: true
                                      message: 请输入 Provider Model Name
                          - type: Field
                            props:
                              label: Model Type
                              required: true
                            children:
                              - type: Select
                                props:
                                  name: type
                                  className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                                  options:
                                    - label: 大语言模型 (LLM)
                                      value: LLM
                                    - label: Embedding
                                      value: Embedding
                                    - label: 文生图 (Image)
                                      value: Image
                                    - label: 音频 (Audio)
                                      value: Audio
                                  rules:
                                    - required: true
                                      message: 请选择 Model Type
                          - type: Field
                            props:
                              label: 发布日期
                            children:
                              - type: Input
                                props:
                                  name: releaseDate
                                  className: w-full
                                  placeholder: YYYY-MM-DD
                          - type: Field
                            props:
                              label: 上下文窗口
                            children:
                              - type: NumberInput
                                props:
                                  name: contextWindow
                                  className: w-full
                                  min: 1
                                  precision: 0
                                  placeholder: Token 数，如 256000
                          - type: Field
                            props:
                              label: Max Tokens
                            children:
                              - type: NumberInput
                                props:
                                  name: maxTokens
                                  className: w-full
                                  min: 1
                                  precision: 0
                                  placeholder: 最大输出 Token，如 32000
                          - type: Field
                            props:
                              label: INPUT 模态
                            children:
                              - type: Input
                                props:
                                  name: inputModalities
                                  className: w-full
                                  placeholder: 逗号分隔：text, image, video
                          - type: Field
                            props:
                              label: OUTPUT 模态
                            children:
                              - type: Input
                                props:
                                  name: outputModalities
                                  className: w-full
                                  placeholder: 逗号分隔：text
                          - type: Field
                            props:
                              label: Tags
                            children:
                              - type: Input
                                props:
                                  name: tags
                                  className: w-full
                                  placeholder: 逗号分隔：free, lite, vision
                          - type: Field
                            props:
                              label: Status
                            children:
                              - type: RadioGroup
                                props:
                                  name: status
                                  direction: horizontal
                                  options:
                                    - label: 启用
                                      value: enabled
                                    - label: 停用
                                      value: disabled
                      - type: Field
                        props:
                          label: Description
                          className: mt-4
                        children:
                          - type: Textarea
                            props:
                              name: description
                              className: w-full
                              placeholder: 模型说明（最长 500 字符）
                              rows: 3
                      - type: Field
                        props:
                          label: 元数据 (JSON)
                        children:
                          - type: Textarea
                            props:
                              name: metadata
                              rows: 3
                              className: font-mono w-full
                              placeholder: '{ "key": "value" }'
                  - key: params
                    label: 默认参数
                    className: p-2
                    children:
                      - type: Alert
                        props:
                          showIcon: true
                          variant: info
                          className: mb-4
                          message: 调用时的默认执行参数；客户端可在允许范围内覆盖。max_tokens 默认值不得超过基本信息中的 Max Tokens。
                      - type: Grid
                        props:
                          columns: 2
                          gap: 16
                        children:
                          - type: Field
                            props:
                              label: temperature
                            children:
                              - type: NumberInput
                                props:
                                  name: temperature
                                  className: w-full
                                  min: 0
                                  max: 2
                                  step: 0.1
                                  placeholder: "0.7"
                          - type: Field
                            props:
                              label: top_p
                            children:
                              - type: NumberInput
                                props:
                                  name: topP
                                  className: w-full
                                  min: 0
                                  max: 1
                                  step: 0.05
                                  placeholder: "0.9"
                          - type: Field
                            props:
                              label: top_k
                            children:
                              - type: NumberInput
                                props:
                                  name: topK
                                  className: w-full
                                  min: 0
                                  precision: 0
                                  placeholder: "40"
                          - type: Field
                            props:
                              label: max_tokens
                            children:
                              - type: NumberInput
                                props:
                                  name: maxTokensParam
                                  className: w-full
                                  min: 1
                                  precision: 0
                                  placeholder: "4096"
                          - type: Field
                            props:
                              label: frequency_penalty
                            children:
                              - type: NumberInput
                                props:
                                  name: frequencyPenalty
                                  className: w-full
                                  min: -2
                                  max: 2
                                  step: 0.1
                                  placeholder: "0"
                          - type: Field
                            props:
                              label: presence_penalty
                            children:
                              - type: NumberInput
                                props:
                                  name: presencePenalty
                                  className: w-full
                                  min: -2
                                  max: 2
                                  step: 0.1
                                  placeholder: "0"
                          - type: Field
                            props:
                              label: reasoning_effort
                            children:
                              - type: Select
                                props:
                                  name: reasoningEffort
                                  className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                                  options:
                                    - label: low
                                      value: low
                                    - label: medium
                                      value: medium
                                    - label: high
                                      value: high
                          - type: Field
                            props:
                              label: seed
                            children:
                              - type: NumberInput
                                props:
                                  name: seed
                                  className: w-full
                                  min: 0
                                  precision: 0
                                  placeholder: 留空表示不固定
                          - type: Field
                            props:
                              label: stop_sequences
                            children:
                              - type: Input
                                props:
                                  name: stopSequences
                                  className: w-full
                                  placeholder: JSON 数组，如 ["\n"]
                          - type: Field
                            props:
                              label: response_format
                            children:
                              - type: Select
                                props:
                                  name: responseFormat
                                  className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                                  options:
                                    - label: text
                                      value: text
                                    - label: json_schema
                                      value: json_schema
                      - type: Field
                        props:
                          label: 能力开关
                          className: mt-4
                        children:
                          - type: Input
                            props:
                              name: capabilities
                              className: w-full
                              placeholder: 逗号分隔：Streaming, Tool Calling, Vision
                  - key: pricing
                    label: 定价
                    className: p-2
                    children:
                      - type: Flex
                        props:
                          justify: space-between
                          align: center
                        children:
                          - type: Text
                            props:
                              text: 标准价格：单位 $/1M · 按 input_tokens 分档（最后一行无上限）
                              type: secondary
                              className: text-sm
                          - type: Button
                            props:
                              text: JSON
                              icon: code
                              size: small
                            events:
                              onClick:
                                - action: message
                                  params:
                                    messageType: info
                                    text: JSON 编辑模式：批量编辑 tiers + multipliers 后回表单校验（演示）
                      - type: Flex
                        props:
                          direction: vertical
                          gap: small
                          className: my-4
                        children:
                          - type: Table
                            props:
                              dataSource: ${data.detail.tiers}
                              rowKey: upto
                              pagination: false
                              columns:
                                - title: UPTO
                                  cell:
                                    type: Text
                                    props:
                                      text: "${row.upto == null ? '∞' : row.upto}"
                                      className: tabular-nums
                                - title: INPUT ($/1M)
                                  dataIndex: input
                                - title: OUTPUT ($/1M)
                                  dataIndex: output
                                - title: CACHE READ
                                  cell:
                                    type: Text
                                    props:
                                      text: "${row.cacheRead == null ? '—' : row.cacheRead}"
                                      className: tabular-nums
                                - title: CACHE WRITE
                                  cell:
                                    type: Text
                                    props:
                                      text: "${row.cacheWrite == null ? '—' : row.cacheWrite}"
                                      className: tabular-nums
                          - type: Button
                            props:
                              text: 添加档位
                              icon: plus
                              size: small
                            events:
                              onClick:
                                - action: message
                                  params:
                                    messageType: info
                                    text: 添加价格档位（演示：UPTO 需严格递增，末行为无上限档）
                      - type: Text
                        props:
                          text: 时段倍率
                          strong: true
                          className: mt-4
                      - type: Flex
                        props:
                          direction: vertical
                          gap: small
                          className: mt-2
                        children:
                          - type: Table
                            when: ${data.detail.timeMultipliers.length > 0}
                            props:
                              dataSource: ${data.detail.timeMultipliers}
                              rowKey: days
                              pagination: false
                              columns:
                                - title: 适用日
                                  dataIndex: days
                                - title: 开始
                                  dataIndex: start
                                - title: 结束
                                  dataIndex: end
                                - title: 倍率
                                  cell:
                                    type: Text
                                    props:
                                      text: ×${row.rate}
                                      className: tabular-nums
                          - type: Text
                            when: ${data.detail.timeMultipliers.length == 0}
                            props:
                              text: 未配置时段倍率，全天按标准价格计费
                              type: secondary
                              className: text-sm
                          - type: Button
                            props:
                              text: 添加时段规则
                              icon: plus
                              size: small
                            events:
                              onClick:
                                - action: message
                                  params:
                                    messageType: info
                                    text: 添加时段倍率规则（演示：每天 / 工作日 / 周末 + 起止时间 + 倍率）
                      - type: Alert
                        props:
                          showIcon: true
                          variant: warning
                          className: mt-4
                          message: 修改时段规则后，会重置关联 Route Target 上继承的时段倍率覆盖。
                      - type: Field
                        props:
                          label: Currency
                          className: mt-4 max-w-[50%]
                        children:
                          - type: Select
                            props:
                              name: currency
                              className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                              options:
                                - label: USD
                                  value: USD
                                - label: CNY
                                  value: CNY
        - type: Flex
          props:
            justify: space-between
            className: mt-4
          children:
            - type: Button
              props:
                text: 删除模型
                icon: trash-2
                danger: true
              events:
                onClick:
                  - id: delCfm
                    action: overlay.open
                    params:
                      overlay:
                        type: modal
                        title: 确认删除模型
                        width: 480
                        content:
                          type: Flex
                          props:
                            direction: vertical
                            gap: middle
                          children:
                            - type: Text
                              props:
                                size: small
                                text: 删除后，该模型将从模型资产中移除，且不可恢复。
                            - type: Flex
                              props:
                                direction: vertical
                                gap: small
                              children:
                                - type: Text
                                  props:
                                    text: 影响范围：
                                    strong: true
                                - type: Text
                                  props:
                                    text: · 供应商模型绑定：${data.detail.suppliers.length} 个（随模型一并删除）
                                    type: secondary
                                - type: Text
                                  props:
                                    text: · 路由引用：${data.detail.routes.total} 条路由
                                    type: secondary
                            - type: Text
                              when: ${data.detail.routes.total > 0}
                              props:
                                size: small
                                text: ⚠ 存在路由引用时，删除会导致对应 Route Target 失效，建议先解除引用。
                                type: warning
                            - type: Flex
                              props:
                                justify: end
                                gap: middle
                              children:
                                - type: Button
                                  props:
                                    text: 取消
                                  events:
                                    onClick:
                                      - action: overlay.close
                                - type: Button
                                  props:
                                    text: 确认删除
                                    variant: primary
                                    danger: true
                                  events:
                                    onClick:
                                      - action: overlay.close
                                        params:
                                          payload:
                                            ok: true
                  - action: if
                    params:
                      condition: ${actions.delCfm.ok}
                      then:
                        - action: message
                          params:
                            messageType: success
                            text: 模型已删除（演示：静态页面不落库）
                        - action: navigate
                          params:
                            to: /models
            - type: Flex
              props:
                align: center
                gap: middle
              children:
                - type: Button
                  props:
                    text: 取消
                    icon: x
                  events:
                    onClick:
                      - action: navigate
                        params:
                          to: /models/${route.params.code}
                - type: Button
                  props:
                    text: 保存
                    icon: save
                    variant: primary
                    submit: true
    - type: Empty
      when: ${data.detail == null && !dataStatus.detail.loading}
      props:
        title: 未找到模型
        description: Model Code「${route.params.code}」不存在或已被删除
      children:
        - type: Button
          props:
            text: 返回列表
            variant: primary
          events:
            onClick:
              - action: navigate
                params:
                  to: /models
