dsl: "1.0"
page:
  id: model-list
  title: $i18n{nexmux.page.model-list.title:模型}
  access-mode: grant
  domain: nexmux
  module: model
  pageKey: nexmux-model-list
  grantGroup: view
  name: modelList
  description: 模型资产 / 模型：对客户端暴露的模型管理（卡片式列表）
state:
  keyword: ""
  typeChip: all
  provChips: []
  page: 1
  catalogOpen: false
  catalogKeyword: ""
  catalogTypes: []
  catalogProviders: []
  catalogAll: []
  catalogRows: []
  catalogSelected: []
  catalogTotal: 0
  catalogSelectedCount: 0
  catalogImportable: 0
  catalogImported: 0
  catalogTypeFilters: []
  catalogProviderFilters: []
dataSources:
  models:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/models
      params:
        keyword: ${state.keyword}
        type: ${state.typeChip}
        providers: ${state.provChips}
        page: ${state.page}
        pageSize: 11
lifecycle:
  onInit:
    - action: if
      params:
        condition: ${route.query.provider != null && route.query.provider != ''}
        then:
          - action: setState
            params:
              provChips: ${route.query.provider}
          - action: reload
            params:
              dataSource: models
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 模型资产
          - label: 模型
    - type: Flex
      props:
        align: baseline
        gap: middle
      children:
        - type: Typography
          props:
            variant: h3
            text: 模型
        - type: Typography
          props:
            variant: muted
            text: 维护对客户端暴露的模型。从目录导入，或新建空白模型。
    - type: Card
      children:
        - type: Flex
          props:
            align: center
            gap: middle
          children:
            - type: Input
              props:
                search: true
                value: ${state.keyword}
                placeholder: 搜索模型编码或名称
                className: min-w-0 flex-1
              events:
                onChange:
                  - action: setState
                    params:
                      keyword: ${event}
                  - action: setState
                    params:
                      page: 1
                  - action: reload
                    params:
                      dataSource: models
            - type: Text
              props:
                text: 共 ${data.models.total} 条
                type: secondary
                className: tabular-nums text-sm
        - type: Flex
          props:
            align: center
            gap: small
            style:
              flexWrap: wrap
            className: mt-2
          children:
            - type: Text
              props:
                text: 类型
                strong: true
                className: w-10
            - type: ChipFilter
              props:
                mode: single
                value: ${state.typeChip}
                items: ${data.models.filters.type}
              events:
                onChange:
                  - action: setState
                    params:
                      typeChip: ${event}
                  - action: setState
                    params:
                      page: 1
                  - action: reload
                    params:
                      dataSource: models
        - type: Flex
          props:
            align: center
            gap: small
            style:
              flexWrap: wrap
            className: mt-2
          children:
            - type: Text
              props:
                text: 厂商
                strong: true
                className: w-10
            - type: ChipFilter
              props:
                mode: multi
                value: ${state.provChips}
                items: ${data.models.filters.providers}
              events:
                onChange:
                  - action: setState
                    params:
                      provChips: ${event}
                  - action: setState
                    params:
                      page: 1
                  - action: reload
                    params:
                      dataSource: models
    - type: For
      props:
        items: ${data.models.items}
        keyField: code
        columns: 3
        gap: 16
        before:
          - type: Card
            props:
              className: border-dashed h-full bg-(--muted) border-2
                border-[color-mix(in_srgb,var(--foreground)_30%,transparent)]
            children:
              - type: Flex
                props:
                  direction: vertical
                  gap: large
                  align: stretch
                children:
                  - type: Flex
                    props:
                      align: center
                      gap: middle
                    children:
                      - type: Flex
                        props:
                          align: center
                          justify: center
                          className: size-10 shrink-0 rounded-full bg-primary
                        children:
                          - type: Icon
                            props:
                              name: plus
                              size: 28
                              color: var(--primary-foreground)
                      - type: Flex
                        props:
                          direction: vertical
                          gap: 2
                        children:
                          - type: Text
                            props:
                              text: 添加模型
                              strong: true
                              className: text-base
                          - type: Text
                            props:
                              text: 从目录导入，或新建空白模型
                              type: secondary
                              className: text-sm
                  - type: Flex
                    props:
                      align: center
                      gap: middle
                    children:
                      - type: Button
                        props:
                          text: 导入
                          icon: download
                          variant: default
                          style:
                            flex: 1
                        events:
                          onClick:
                            - action: modelCatalog.load
                      - type: Button
                        props:
                          text: 新建
                          icon: plus
                          variant: primary
                          style:
                            flex: 1
                        events:
                          onClick:
                            - action: navigate
                              params:
                                to: /models/new
      children:
        - type: ModelCardLink
          props:
            href: /models/${row.code}
          children:
            - type: Card
              props:
                className: h-full model-card relative
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        justify: center
                        className: size-14 shrink-0 rounded-full bg-(--muted)
                      children:
                        - type: Icon
                          props:
                            name: ${row.providerIcon}
                            size: 28
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 0
                        style:
                          alignItems: flex-start
                          flex: 1
                      children:
                        - type: Button
                          props:
                            text: ${row.name}
                            variant: link
                            className: p-0 font-semibold text-base
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /models/${row.code}
                        - type: Text
                          props:
                            text: ${row.code}
                            type: secondary
                            className: text-sm
                - type: Flex
                  props:
                    align: center
                    gap: 2
                    className: absolute right-3 top-3 model-card-actions
                  children:
                    - type: Tooltip
                      props:
                        content: "${row.status == 'enabled' ? '停用' : '启用'}"
                      children:
                        - type: Button
                          props:
                            variant: text
                            size: small
                            className: size-6 p-0
                          children:
                            - type: StatusToggleIcon
                              props:
                                enabled: ${row.status == 'enabled'}
                          events:
                            onClick:
                              - id: statusCfm
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: "${row.status == 'enabled' ? '确认停用 Model' : '确认启用 Model'}"
                                    width: 480
                                    content:
                                      type: Flex
                                      props:
                                        direction: vertical
                                        gap: middle
                                      children:
                                        - type: Text
                                          props:
                                            size: small
                                            text: "${parent.row.status == 'enabled' ? '停用后，该模型将不再参与路由调度，客户端通过路由调用该模型将失败。' :
                                              '启用后，该模型可被路由引用与调度。'}"
                                        - type: Flex
                                          props:
                                            direction: vertical
                                            gap: small
                                          children:
                                            - type: Text
                                              props:
                                                text: 影响范围：
                                                strong: true
                                            - type: Text
                                              props:
                                                text: · 供应商模型绑定：${parent.row.suppliers.length} 个
                                                type: secondary
                                            - type: Text
                                              props:
                                                text: · 路由引用：${parent.row.routes.total} 条路由（${parent.row.routes.active} 条活跃）
                                                type: secondary
                                        - type: Text
                                          when: ${parent.row.status == 'enabled' && parent.row.routes.active > 0}
                                          props:
                                            size: small
                                            text: ⚠ 存在活跃路由引用时，建议先完成切换再停用。
                                            type: warning
                                        - type: Flex
                                          props:
                                            justify: end
                                            gap: middle
                                          children:
                                            - type: Button
                                              props:
                                                text: 取消
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                            - type: Button
                                              props:
                                                text: "${parent.row.status == 'enabled' ? '确认停用' : '确认启用'}"
                                                variant: primary
                                                danger: ${parent.row.status == 'enabled'}
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                                    params:
                                                      payload:
                                                        ok: true
                              - action: if
                                params:
                                  condition: ${actions.statusCfm.ok}
                                  then:
                                    - id: toggleResult
                                      action: util.request
                                      params:
                                        method: POST
                                        url: "/api/d/ops/model-${row.status == 'enabled'
                                          ? 'disable' : 'enable'}?code=${row.code}"
                                    - action: if
                                      params:
                                        condition: ${actions.toggleResult == null || actions.toggleResult.ok
                                          == false}
                                        then:
                                          - action: message
                                            params:
                                              messageType: error
                                              text: "${actions.toggleResult != null && actions.toggleResult.error
                                                != null ? actions.toggleResult.error.message
                                                : '操作失败'}"
                                    - action: if
                                      params:
                                        condition: ${actions.toggleResult != null && actions.toggleResult.ok
                                          != false}
                                        then:
                                          - action: message
                                            params:
                                              messageType: success
                                              text: "${row.status == 'enabled' ? '已停用' : '已启用'}"
                                          - action: reload
                                            params:
                                              dataSource: models
                    - type: Tooltip
                      props:
                        content: 编辑
                      children:
                        - type: Button
                          props:
                            icon: pencil
                            variant: text
                            size: small
                            className: size-6 p-0
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /models/${row.code}/edit
                - type: Flex
                  props:
                    align: center
                    justify: space-between
                  children:
                    - type: Flex
                      props:
                        align: center
                        gap: small
                        className: shrink-0 whitespace-nowrap
                      children:
                        - type: Badge
                          props:
                            text: ${row.type}
                            variant: outline
                        - type: Text
                          props:
                            text: ${row.specSummary}
                            className: tabular-nums
                    - type: Flex
                      props:
                        align: center
                        gap: small
                        className: shrink-0 whitespace-nowrap
                      children:
                        - type: Text
                          props:
                            text: ${row.pricingSummary}
                            className: tabular-nums
                        - type: Badge
                          when: ${row.tierLabel != ''}
                          props:
                            text: ${row.tierLabel}
                            variant: secondary
                - type: Flex
                  props:
                    justify: end
                    align: center
                  children:
                    - type: Button
                      props:
                        text: ${row.routeSummary}
                        variant: link
                        size: small
                        className: p-0 h-auto text-(--muted-foreground)
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /routes?model=${row.code}
    - type: Pagination
      props:
        total: ${data.models.total}
        pageSize: 12
        page: ${state.page}
        className: mt-4
      events:
        onChange:
          - action: setState
            params:
              page: ${event}
          - action: reload
            params:
              dataSource: models
    - type: Dialog
      props:
        title: 从静态目录导入
        description: 目录来自已创建的供应商模板。已导入的模型不可再次选择，重复导入会自动跳过；定价按每百万 token 的美元单价展示。
        open: ${state.catalogOpen}
        style:
          width: 940
          maxWidth: 96vw
      events:
        onClose:
          - action: setState
            params:
              catalogOpen: false
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
            className: w-full min-w-0
          children:
            - type: Flex
              props:
                align: center
                gap: small
              children:
                - type: Input
                  props:
                    search: true
                    value: ${state.catalogKeyword}
                    placeholder: 搜索 Model ID 或显示名称
                    className: min-w-0 flex-1
                  events:
                    onChange:
                      - action: modelCatalog.search
                        params:
                          keyword: ${event}
                - type: Button
                  props:
                    text: 全选
                    variant: default
                    size: small
                  events:
                    onClick:
                      - action: modelCatalog.selectAll
                - type: Button
                  props:
                    text: 清除
                    variant: text
                    size: small
                  events:
                    onClick:
                      - action: modelCatalog.clear
            - type: Flex
              props:
                align: center
                gap: small
                style:
                  flexWrap: wrap
              children:
                - type: Text
                  props:
                    text: 安装模型类型
                    strong: true
                    className: w-24 text-sm
                - type: ChipFilter
                  props:
                    mode: multi
                    value: ${state.catalogTypes}
                    items: ${state.catalogTypeFilters}
                  events:
                    onChange:
                      - action: modelCatalog.filterTypes
                        params:
                          types: ${event}
            - type: Flex
              props:
                align: center
                gap: small
                style:
                  flexWrap: wrap
              children:
                - type: Text
                  props:
                    text: 供应商
                    strong: true
                    className: w-24 text-sm
                - type: ChipFilter
                  props:
                    mode: multi
                    value: ${state.catalogProviders}
                    items: ${state.catalogProviderFilters}
                  events:
                    onChange:
                      - action: modelCatalog.filterProviders
                        params:
                          providers: ${event}
            - type: Text
              props:
                text: 可导入 ${state.catalogImportable} 个 · 已导入 ${state.catalogImported} 个 · 当前筛选 ${state.catalogTotal} 条
                type: secondary
                className: text-sm
            - type: Flex
              props:
                direction: vertical
                gap: small
                style:
                  maxHeight: 54vh
                  overflowY: auto
                className: w-full min-w-0 overflow-x-auto
              children:
                - type: Table
                  when: ${state.catalogRows.length > 0}
                  props:
                    dataSource: ${state.catalogRows}
                    rowKey: key
                    pagination:
                      pageSize: 50
                    columns:
                      - title: 选择
                        width: 56
                        cell:
                          type: Checkbox
                          props:
                            value: ${row.checked}
                            disabled: ${row.existsLocally}
                          events:
                            onChange:
                              - action: modelCatalog.toggle
                                params:
                                  key: "${row.providerCode}::${row.id}"
                                  existsLocally: ${row.existsLocally}
                                  checked: ${event}
                      - title: Model ID
                        dataIndex: id
                      - title: 显示名称
                        cell:
                          type: Flex
                          props:
                            direction: vertical
                            gap: 1
                            className: max-w-[360px] min-w-0
                          children:
                            - type: Text
                              props:
                                text: ${row.name}
                                strong: true
                            - type: Text
                              when: ${row.description != null && row.description != ''}
                              props:
                                text: ${row.description}
                                type: secondary
                                className: text-xs line-clamp-1
                      - title: 供应商
                        dataIndex: providerName
                      - title: 类型
                        dataIndex: modelType
                      - title: Context
                        dataIndex: contextLength
                      - title: Max Tokens
                        dataIndex: maxOutputTokens
                      - title: 定价
                        cell:
                          type: Text
                          props:
                            text: "${row.pricingLabel != null && row.pricingLabel != '' ? row.pricingLabel : '—'}"
                            type: secondary
                            className: text-xs
                      - title: 状态
                        cell:
                          type: Badge
                          props:
                            text: "${row.existsLocally ? '已导入' : '可导入'}"
                            variant: "${row.existsLocally ? 'secondary' : 'default'}"
                - type: Empty
                  when: ${state.catalogRows.length == 0}
                  props:
                    title: 没有可导入的模型
                    description: 当前供应商的模型已全部导入，或先到「供应商」导入/新建供应商
            - type: Flex
              props:
                justify: end
                gap: middle
              children:
                - type: Button
                  props:
                    text: 取消
                  events:
                    onClick:
                      - action: setState
                        params:
                          catalogOpen: false
                - type: Button
                  props:
                    text: 导入选中项 (${state.catalogSelectedCount})
                    variant: primary
                    disabled: ${state.catalogSelectedCount == 0}
                  events:
                    onClick:
                      - id: catalogImport
                        action: modelCatalog.import
                      - action: if
                        params:
                          condition: ${actions.catalogImport.ok == false}
                          then:
                            - action: message
                              params:
                                messageType: error
                                text: ${actions.catalogImport.error.message}
                      - action: if
                        params:
                          condition: ${actions.catalogImport.ok != false}
                          then:
                            - action: message
                              params:
                                messageType: success
                                text: "已导入 ${actions.catalogImport.data.created} 个模型；跳过 ${actions.catalogImport.data.skipped.length} 个已存在项"
                            - action: modelCatalog.refresh
                            - action: reload
                              params:
                                dataSource: models
    - type: Empty
      when: ${data.models.items != null && data.models.items.length == 0}
      props:
        title: 无匹配模型
        description: 调整类型或厂商筛选后重试；也可以从已配置的 Provider 导入模型
