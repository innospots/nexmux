dsl: "1.0"
page:
  id: service-settings
  title: 服务设置
  name: serviceSettings
  description: 系统管理 / 服务设置：平台级全局参数，影响控制台展示、计量汇总与运行策略默认值
dataSources:
  settings:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/service-settings
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 系统管理
          - label: 服务设置
    - type: Flex
      props:
        align: baseline
        gap: middle
      children:
        - type: Typography
          props:
            variant: h3
            text: 服务设置
        - type: Typography
          props:
            variant: muted
            text: 平台全局参数配置
    - type: Form
      when: ${data.settings != null}
      props:
        layout: vertical
        initialValues:
          timezone: ${data.settings.timezone}
          language: ${data.settings.language}
          displayName: ${data.settings.displayName}
          currency: ${data.settings.currency}
          currencyDecimals: ${data.settings.currencyDecimals}
          tokenDisplay: ${data.settings.tokenDisplay}
          dateFormat: ${data.settings.dateFormat}
          timeFormat: ${data.settings.timeFormat}
          promptPolicy: ${data.settings.promptPolicy}
          debugInvokeEnabled: ${data.settings.debugInvokeEnabled}
          debugDailyQuota: ${data.settings.debugDailyQuota}
          logRetentionDays: ${data.settings.logRetentionDays}
          requestTimeoutMs: ${data.settings.requestTimeoutMs}
          upstreamConnectTimeoutMs: ${data.settings.upstreamConnectTimeoutMs}
      events:
        onSubmit:
          - action: if
            params:
              condition: ${event.promptPolicy == 'full'}
              then:
                - id: saveCfm
                  action: overlay.open
                  params:
                    overlay:
                      type: modal
                      title: 确认启用完整保存
                      width: 480
                      content:
                        type: Flex
                        props:
                          direction: vertical
                          gap: middle
                        children:
                          - type: Text
                            props:
                              size: small
                              text: 完整保存将原样留存 Prompt / Response 内容，可能包含用户敏感数据。
                          - type: Text
                            props:
                              size: small
                              type: secondary
                              text: 请确认已评估合规风险；该变更将写入审计日志。
                          - type: Flex
                            props:
                              justify: end
                              gap: middle
                            children:
                              - type: Button
                                props:
                                  text: 取消
                                events:
                                  onClick:
                                    - action: overlay.close
                              - type: Button
                                props:
                                  text: 确认保存
                                  variant: primary
                                  danger: true
                                events:
                                  onClick:
                                    - action: overlay.close
                                      params:
                                        payload:
                                          ok: true
          - action: if
            params:
              condition: ${event.promptPolicy != 'full' || actions.saveCfm.ok}
              then:
                - id: saveResult
                  action: util.request
                  params:
                    method: PUT
                    url: /api/d/service-settings
                    body: ${event}
                - action: if
                  params:
                    condition: ${actions.saveResult == null || actions.saveResult.ok
                      == false}
                    then:
                      - action: message
                        params:
                          messageType: error
                          text: "${actions.saveResult != null && actions.saveResult.error
                            != null ? actions.saveResult.error.message
                            : '保存失败'}"
                - action: if
                  params:
                    condition: ${actions.saveResult != null && actions.saveResult.ok
                      != false}
                    then:
                      - action: message
                        params:
                          messageType: success
                          text: 服务设置已保存，变更已写入审计日志
                      - action: reload
                        params:
                          dataSource: settings
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            - type: Card
              props:
                title: 区域与展示
              children:
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                  children:
                    - type: Field
                      props:
                        label: 控制台时区
                        required: true
                        description: 影响 Dashboard、运行管理、调用日志等页面的时间展示；底层存储仍为 UTC
                      children:
                        - type: Select
                          props:
                            name: timezone
                            className: w-full
                            options:
                              - label: Asia/Shanghai (UTC+8)
                                value: Asia/Shanghai
                              - label: Asia/Tokyo (UTC+9)
                                value: Asia/Tokyo
                              - label: Europe/London (UTC+0)
                                value: Europe/London
                              - label: America/New_York (UTC-5)
                                value: America/New_York
                              - label: UTC
                                value: UTC
                            rules:
                              - required: true
                                message: 请选择控制台时区
                    - type: Field
                      props:
                        label: 默认语言
                      children:
                        - type: Select
                          props:
                            name: language
                            className: w-full
                            options:
                              - label: 简体中文 (zh-CN)
                                value: zh-CN
                              - label: English (en-US)
                                value: en-US
                    - type: Field
                      props:
                        label: 平台显示名称
                      children:
                        - type: Input
                          props:
                            name: displayName
                            className: w-full
                            placeholder: 浏览器标题、登录页等展示名
            - type: Card
              props:
                title: 计费与数值
              children:
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                  children:
                    - type: Field
                      props:
                        label: 计费币种
                        required: true
                        description: 用量与成本页、Dashboard 金额列据此展示；Model 定价可存多币种
                      children:
                        - type: Select
                          props:
                            name: currency
                            className: w-full
                            options:
                              - label: USD
                                value: USD
                              - label: CNY
                                value: CNY
                              - label: EUR
                                value: EUR
                            rules:
                              - required: true
                                message: 请选择计费币种
                    - type: Field
                      props:
                        label: 金额小数位
                        description: 标准 / 计费 / 成本列与 Dashboard 金额的小数位
                      children:
                        - type: Select
                          props:
                            name: currencyDecimals
                            className: w-full
                            options:
                              - label: "2"
                                value: "2"
                              - label: "4"
                                value: "4"
                              - label: "6"
                                value: "6"
                    - type: Field
                      props:
                        label: Token 默认显示
                        description: 运行管理用量页进入时的默认格式，用户可页内切换
                      children:
                        - type: RadioGroup
                          props:
                            name: tokenDisplay
                            direction: horizontal
                            options:
                              - label: 紧凑 (K/M/B)
                                value: compact
                              - label: 完整数字
                                value: full
            - type: Card
              props:
                title: 日期时间格式
              children:
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                  children:
                    - type: Field
                      props:
                        label: 日期格式
                      children:
                        - type: Select
                          props:
                            name: dateFormat
                            className: w-full
                            options:
                              - label: YYYY-MM-DD
                                value: YYYY-MM-DD
                              - label: DD/MM/YYYY
                                value: DD/MM/YYYY
                              - label: MM/DD/YYYY
                                value: MM/DD/YYYY
                    - type: Field
                      props:
                        label: 时间格式
                      children:
                        - type: Select
                          props:
                            name: timeFormat
                            className: w-full
                            options:
                              - label: HH:mm:ss (24h)
                                value: HH:mm:ss
                              - label: hh:mm:ss A (12h)
                                value: hh:mm:ss A
            - type: Card
              props:
                title: 日志与合规（平台默认）
              children:
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                  children:
                    - type: Field
                      props:
                        label: Prompt/Response 保存策略
                        required: true
                        description: 调用日志详情 Tab 按此策略展示；P1 支持按 Client 覆盖
                      children:
                        - type: Select
                          props:
                            name: promptPolicy
                            className: w-full
                            options:
                              - label: 不保存
                                value: none
                              - label: 脱敏保存
                                value: masked
                              - label: 抽样保存
                                value: sampling
                              - label: 完整保存
                                value: full
                            rules:
                              - required: true
                                message: 请选择Prompt/Response 保存策略
                    - type: Field
                      props:
                        label: 调用日志保留天数
                        description: 超期归档或清理（Runtime 执行）
                      children:
                        - type: Flex
                          props:
                            align: center
                            gap: small
                          children:
                            - type: NumberInput
                              props:
                                name: logRetentionDays
                                className: w-full
                                min: 1
                                precision: 0
                                style:
                                  flex: 1
                            - type: Text
                              props:
                                text: 天
                                type: secondary
            - type: Card
              props:
                title: 运行默认值
              children:
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                  children:
                    - type: Field
                      props:
                        label: 默认请求超时 (ms)
                        description: 未在 Route / Client 覆盖时的全局默认
                      children:
                        - type: NumberInput
                          props:
                            name: requestTimeoutMs
                            className: w-full
                            min: 1000
                            precision: 0
                    - type: Field
                      props:
                        label: 上游连接超时 (ms)
                        description: Provider 探测与转发的默认连接超时
                      children:
                        - type: NumberInput
                          props:
                            name: upstreamConnectTimeoutMs
                            className: w-full
                            min: 1000
                            precision: 0
            - type: Card
              props:
                title: 调试台限域（Console 内数据面模拟）
              children:
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                  children:
                    - type: Field
                      props:
                        label: 允许调试调用
                        required: true
                        description: 关闭后调试台四条链路整体拒绝（403）；调试会产生真实上游调用与费用
                      children:
                        - type: RadioGroup
                          props:
                            name: debugInvokeEnabled
                            direction: horizontal
                            options:
                              - label: 开启
                                value: "true"
                              - label: 关闭
                                value: "false"
                    - type: Field
                      props:
                        label: 调试日配额
                        description: 当日 source=DEBUG 调用达到上限后拒绝（429）；-1 表示不限量
                      children:
                        - type: Flex
                          props:
                            align: center
                            gap: small
                          children:
                            - type: NumberInput
                              props:
                                name: debugDailyQuota
                                className: w-full
                                min: -1
                                precision: 0
                                style:
                                  flex: 1
                            - type: Text
                              props:
                                text: 次 / 日
                                type: secondary
        - type: Flex
          props:
            justify: end
            gap: middle
            className: mt-4
          children:
            - type: Button
              props:
                text: 取消
                icon: x
              events:
                onClick:
                  - action: reload
                    params:
                      dataSource: settings
                  - action: form.setValues
                    params:
                      values: ${data.settings}
                  - action: message
                    params:
                      messageType: info
                      text: 已放弃修改，还原为当前生效配置
            - type: Button
              props:
                text: 保存
                icon: check-circle
                variant: primary
                submit: true
