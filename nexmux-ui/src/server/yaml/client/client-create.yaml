                                                align: stretch
                                              children:
                                                - type: Flex
                                                  props:
                                                    gap: small
                                                    align: center
                                                  children:
                                                    - type: Select
                                                      props:
                                                        value: ${state.pendingScopeRouteId}
                                                        placeholder: 选择授权路由（来自当前授权列表）
                                                        options: ${state.scopeRouteOptions}
                                                        controlClassName: w-full [&_[data-slot=select-trigger]]:w-full
                                                      events:
                                                        onChange:
                                                          - action: setState
                                                            params:
                                                              pendingScopeRouteId: ${event}
                                                    - type: Button
                                                      props:
                                                        text: 添加
                                                        size: small
                                                      events:
                                                        onClick:
                                                          - action: policy.addScopeRoute
                                                            params:
                                                              routeId: ${state.pendingScopeRouteId}
                                                - type: Table
                                                  when: ${state.pendingScopeRoutes.length > 0}
                                                  props:
                                                    dataSource: ${state.pendingScopeRoutes}
                                                    rowKey: routeId
                                                    pagination: false
                                                    columns:
                                                      - title: 路由名称
                                                        dataIndex: name
                                                      - title: 操作
                                                        align: center
                                                        width: 80
                                                        cell:
                                                          type: Button
                                                          props:
                                                            text: 移除
                                                            variant: link
                                                            size: small
                                                            danger: true
                                                            className: p-0 h-auto
                                                          events:
                                                            onClick:
                                                              - action: policy.removeScopeRoute
                                                                params:
                                                                  routeId: ${row.routeId}
                                            - type: Flex
                                              props:
                                                justify: end
                                                gap: middle
                                              children:
                                                - type: Button
                                                  props:
                                                    text: 取消
                                                  events:
                                                    onClick:
                                                      - action: overlay.close
                                                - type: Button
                                                  props:
                                                    text: 保存
                                                    variant: primary
                                                    submit: true
                    - type: Table
                      when: ${state.record.rateLimits.length > 0}
                      props:
                        dataSource: ${state.record.rateLimits}
                        rowKey: name
                        pagination: false
                        className: mt-2
                        columns:
                          - title: 规则名称
                            dataIndex: name
                          - title: 限流类型
                            dataIndex: limitTypeLabel
                          - title: 上限
                            cell:
                              type: Text
                              props:
                                text: "${row.limitType == 'CONCURRENT' ? row.limitText + ' 并发' : row.limitText + ' / 分钟'}"
                          - title: Burst
                            cell:
                              type: Text
                              props:
                                text: "${row.burst == null ? '—' : row.burst}"
                          - title: 作用范围
                            dataIndex: scopeLabel
                          - title: 状态
                            cell:
                              type: StatusBadge
                              props:
                                status: ${row.status}
                          - title: 操作
                            align: center
                            width: 130
                            cell:
                              type: Flex
                              props:
                                gap: small
                                justify: center
                              children:
                                - type: Button
                                  props:
                                    text: 编辑
                                    variant: link
                                    size: small
                                    className: p-0 h-auto
                                  events:
                                    onClick:
                                      - action: policy.beginRateLimitEdit
                                        params:
                                          scopeRoutes: ${row.scopeRoutes}
                                          scopeAll: ${row.scopeAll}
                                      - action: policy.scopeRouteOptions
                                      - id: editRateLimit
                                        action: overlay.open
                                        params:
                                          overlay:
                                            type: modal
                                            title: 编辑限流规则
                                            width: 560
                                            content:
                                              type: Form
                                              props:
                                                  name: rateLimitRule
                                                  initialValues:
                                                    name: ${parent.row.name}
                                                    limitType: ${parent.row.limitType}
                                                    limit: ${parent.row.limit}
                                                    burst: ${parent.row.burst}
                                                    scope: "${parent.row.scopeAll ? 'all' : 'routes'}"
                                              events:
                                                onSubmit:
                                                    - action: policy.upsertRateLimit
                                                      params:
                                                        original: ${parent.row.name}
                                                        rateLimit: ${event}
                                                    - action: overlay.close
                                                    - action: message
                                                      params:
                                                        messageType: success
                                                        text: 限流规则已更新
                                              children:
                                                - type: Flex
                                                  props:
                                                    direction: vertical
                                                    gap: middle
                                                    align: stretch
                                                  children:
                                                    - type: Field
                                                      props:
                                                        label: 规则名称
                                                        required: true
                                                      children:
                                                        - type: Input
                                                          props:
                                                            name: name
                                                            className: w-full
                                                            placeholder: 如 app-rpm
                                                            rules:
                                                              - required: true
                                                                message: 请输入规则名称
                                                    - type: Field
                                                      props:
                                                        label: 限流类型
                                                        required: true
                                                      children:
                                                        - type: Select
                                                          props:
                                                            name: limitType
                                                            className: w-full
                                                            options:
                                                              - label: RPM（每分钟请求数）
                                                                value: RPM
                                                              - label: TPM（每分钟 Token 数）
                                                                value: TPM
                                                              - label: Concurrent（并发连接数）
                                                                value: CONCURRENT
                                                    - type: Field
                                                      props:
                                                        label: 上限
                                                        required: true
                                                      children:
                                                        - type: NumberInput
                                                          props:
                                                            name: limit
                                                            className: w-full
                                                            min: 1
                                                            precision: 0
                                                            placeholder: 如 1000
                                                            rules:
                                                              - required: true
                                                                message: 请输入上限
                                                    - type: Field
                                                      props:
                                                        label: Burst（Concurrent 时不适用）
                                                      children:
                                                        - type: NumberInput
                                                          props:
                                                            name: burst
                                                            className: w-full
                                                            min: 1
                                                            precision: 0
                                                            placeholder: 可选，如 100
                                                    - type: Field
                                                      props:
                                                        label: 作用范围
                                                      children:
                                                        - type: RadioGroup
                                                          props:
                                                            name: scope
                                                            direction: horizontal
                                                            options:
                                                              - label: 全部授权路由
                                                                value: all
                                                              - label: 指定路由
                                                                value: routes
                                                          events:
                                                            onChange:
                                                              - action: setState
                                                                params:
                                                                  rateLimitScope: ${event}
                                                    - type: Flex
                                                      when: ${state.rateLimitScope == 'routes'}
                                                      props:
                                                        direction: vertical
                                                        gap: small
                                                        align: stretch
                                                      children:
                                                        - type: Flex
                                                          props:
                                                            gap: small
                                                            align: center
                                                          children:
                                                            - type: Select
                                                              props:
                                                                value: ${state.pendingScopeRouteId}
                                                                placeholder: 选择授权路由（来自当前授权列表）
                                                                options: ${state.scopeRouteOptions}
                                                                controlClassName: w-full [&_[data-slot=select-trigger]]:w-full
                                                              events:
                                                                onChange:
                                                                  - action: setState
                                                                    params:
                                                                      pendingScopeRouteId: ${event}
                                                            - type: Button
                                                              props:
                                                                text: 添加
                                                                size: small
                                                              events:
                                                                onClick:
                                                                  - action: policy.addScopeRoute
                                                                    params:
                                                                      routeId: ${state.pendingScopeRouteId}
                                                        - type: Table
                                                          when: ${state.pendingScopeRoutes.length > 0}
                                                          props:
                                                            dataSource: ${state.pendingScopeRoutes}
                                                            rowKey: routeId
                                                            pagination: false
                                                            columns:
                                                              - title: 路由名称
                                                                dataIndex: name
                                                              - title: 操作
                                                                align: center
                                                                width: 80
                                                                cell:
                                                                  type: Button
                                                                  props:
                                                                    text: 移除
                                                                    variant: link
                                                                    size: small
                                                                    danger: true
                                                                    className: p-0 h-auto
                                                                  events:
                                                                    onClick:
                                                                      - action: policy.removeScopeRoute
                                                                        params:
                                                                          routeId: ${row.routeId}
                                                    - type: Flex
                                                      props:
                                                        justify: end
                                                        gap: middle
                                                      children:
                                                        - type: Button
                                                          props:
                                                            text: 取消
                                                          events:
                                                            onClick:
                                                              - action: overlay.close
                                                        - type: Button
                                                          props:
                                                            text: 保存
                                                            variant: primary
                                                            submit: true
                                - type: Button
                                  props:
                                    text: 删除
                                    variant: link
                                    size: small
                                    danger: true
                                    className: p-0 h-auto
                                  events:
                                    onClick:
                                      - id: delRateLimitCfm
                                        action: overlay.open
                                        params:
                                          overlay:
                                            type: modal
                                            title: 确认删除限流规则
                                            width: 480
                                            content:
                                              type: Flex
                                              props:
                                                direction: vertical
                                                gap: middle
                                              children:
                                                - type: Text
                                                  props:
                                                    size: small
                                                    text: 删除后，限流规则「${parent.row.name}」将立即失效且不可恢复。
                                                - type: Flex
                                                  props:
                                                    justify: end
                                                    gap: middle
                                                  children:
                                                    - type: Button
                                                      props:
                                                        text: 取消
                                                      events:
                                                        onClick:
                                                          - action: overlay.close
                                                    - type: Button
                                                      props:
                                                        text: 确认删除
                                                        variant: primary
                                                        danger: true
                                                      events:
                                                        onClick:
                                                          - action: overlay.close
                                                            params:
                                                              payload:
                                                                ok: true
                                      - action: if
                                        params:
                                          condition: ${actions.delRateLimitCfm.ok}
                                          then:
                                            - action: policy.removeRateLimit
                                              params:
                                                name: ${row.name}
                                            - action: message
                                              params:
                                                messageType: success
                                                text: 已删除限流规则
                    - type: Text
                      when: ${state.record.rateLimits.length == 0}
                      props:
                        text: 尚未配置限流规则。
                        type: secondary
        - type: Flex
          props:
            justify: end
            className: mt-4
          children:
            - type: Flex
              props:
                align: center
                gap: middle
              children:
                - type: Button
                  props:
                    text: 取消
                    icon: x
                  events:
                    onClick:
                      - action: navigate
                        params:
                          to: /clients
                - type: Button
                  props:
                    text: 保存并启用
                    icon: check-circle
                    variant: primary
                    submit: true

