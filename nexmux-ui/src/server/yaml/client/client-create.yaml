dsl: "1.0"
page:
  id: client-create
  title: 新建客户端
  name: clientForm
  description: 创建或修改客户端：基本信息、AppKey、路由授权、配额与限流策略
state:
  pendingRouteId: ""
  routeOptions: []
  routeOptionRows: []
  pendingScopeRouteId: ""
  pendingScopeRoutes: []
  scopeRouteOptions: []
  rateLimitScope: all
  record:
    authRoutes: []
    quotas: []
    rateLimits: []
    tags: []
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 访问治理
          - label: 客户端
            href: /clients
          - label: 新建客户端
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: small
          children:
            - type: Flex
              props:
                align: center
                gap: middle
              children:
                - type: Typography
                  props:
                    variant: h3
                    text: 新建客户端
            - type: Typography
              props:
                variant: muted
                text: 在单一页面完成客户端配置：名称、有效期、路由授权、配额与限流；客户端另含 AppKey。
    - type: Form
      props:
        layout: vertical
        initialValues: {}
      events:
        onSubmit:
          - id: createResult
            action: policy.submit
            params:
              mode: clientCreate
              url: /api/d/clients
              values: ${event}
          - action: if
            params:
              condition: ${actions.createResult == null || actions.createResult.ok == false}
              then:
                - action: message
                  params:
                    messageType: error
                    text: "${actions.createResult != null && actions.createResult.error != null ? actions.createResult.error.message : '创建失败'}"
          - action: if
            params:
              condition: ${actions.createResult != null && actions.createResult.ok != false}
              then:
                - id: appKeyShown
                  action: overlay.open
                  params:
                    overlay:
                      type: modal
                      title: 客户端已创建 — 保存 AppKey
                      width: 520
                      content:
                        type: Flex
                        props:
                          direction: vertical
                          gap: middle
                        children:
                          - type: Alert
                            props:
                              showIcon: true
                              variant: warning
                              message: AppKey Secret 仅此一次展示，请立即复制保存。
                          - type: Flex
                            props:
                              direction: vertical
                              gap: small
                            children:
                              - type: Text
                                props:
                                  size: small
                                  type: secondary
                                  text: AppKey ID
                              - type: Text
                                props:
                                  strong: true
                                  className: font-mono
                                  text: ${actions.createResult.data.client.appKeyId}
                              - type: Text
                                props:
                                  size: small
                                  type: secondary
                                  text: AppKey Secret
                              - type: Text
                                props:
                                  strong: true
                                  className: font-mono
                                  text: ${actions.createResult.data.appKeyPlaintext}
                          - type: Flex
                            props:
                              justify: end
                            children:
                              - type: Button
                                props:
                                  text: 我已保存
                                  variant: primary
                                events:
                                  onClick:
                                    - action: overlay.close
                                      params:
                                        payload:
                                          ok: true
                - action: navigate
                  params:
                    to: /clients
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            - type: Card
              props:
                title: ① 基本信息
              children:
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                    className: "[&>[data-slot=grid-item]:last-child]:col-span-full"
                  children:
                    - type: Field
                      props:
                        label: 名称
                        required: true
                      children:
                        - type: Input
                          props:
                            name: name
                            className: w-full
                            placeholder: 展示名，如 agent-app
                            rules:
                              - required: true
                                message: 请输入客户端名称
                    - type: Field
                      props:
                        label: 标识
                        required: true
                        labelHint: 创建后不可修改
                      children:
                        - type: Input
                          props:
                            name: code
                            className: w-full
                            placeholder: 小写 + 数字 + 连字符，如 agent-app
                            disabled: false
                            rules:
                              - required: true
                                message: 请输入客户端标识
                    - type: Field
                      props:
                        label: 有效期
                        required: true
                      children:
                        - type: DatePicker
                          props:
                            name: expiresAt
                            className: w-full
                            placeholder: 请选择有效期
                            rules:
                              - required: true
                                message: 请选择有效期
                    - type: Field
                      props:
                        label: 标签
                      children:
                        - type: Input
                          props:
                            name: tags
                            className: w-full
                            placeholder: 逗号分隔：agent, prod
                    - type: Field
                      props:
                        label: 描述
                      children:
                        - type: Textarea
                          props:
                            name: description
                            className: w-full
                            rows: 3
            - type: Card
              props:
                title: ② AppKey
              children:
                - type: Alert
                  props:
                    showIcon: true
                    variant: info
                    message: 创建成功后展示 AppKey ID + Secret（仅一次），请妥善保存。
            - type: Card
              props:
                title: ③ 路由授权
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: center
                  children:
                    - type: Text
                      props:
                        text: 未授权 Route 拒绝调用。
                        type: secondary
                    - type: Button
                      props:
                        text: + 添加路由
                        size: small
                      events:
                        onClick:
                          - id: routeOpts
                            action: clientRoutes.loadOptions
                          - id: addRoute
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: 添加路由授权
                                width: 640
                                content:
                                  type: Flex
                                  props:
                                    direction: vertical
                                    gap: middle
                                    align: stretch
                                  children:
                                    - type: Field
                                      props:
                                        label: 可选路由（仅已启用）
                                        required: true
                                      children:
                                        - type: Select
                                          props:
                                            value: ${state.pendingRouteId}
                                            placeholder: 选择要授权的路由
                                            options: ${state.routeOptions}
                                            controlClassName: w-full [&_[data-slot=select-trigger]]:w-full
                                          events:
                                            onChange:
                                              - action: setState
                                                params:
                                                  pendingRouteId: ${event}
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: middle
                                      children:
                                        - type: Button
                                          props:
                                            text: 取消
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: 确认添加
                                            variant: primary
                                          events:
                                            onClick:
                                              - action: clientRoutes.add
                                                params:
                                                  routeId: ${state.pendingRouteId}
                                              - action: overlay.close
                                              - action: message
                                                params:
                                                  messageType: success
                                                  text: 已添加路由授权
                - type: Table
                  props:
                    dataSource: ${state.record.authRoutes}
                    rowKey: code
                    pagination: false
                    className: mt-2
                    columns:
                      - title: 路由名称
                        cell:
                          type: Button
                          props:
                            text: ${row.name}
                            variant: link
                            size: small
                            className: p-0 h-auto
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /routes/${row.code}
                      - title: Alias
                        dataIndex: alias
                      - title: 类型
                        dataIndex: typeLabel
                      - title: 请求路径
                        dataIndex: path
                      - title: 操作
                        align: center
                        width: 80
                        cell:
                          type: Button
                          props:
                            text: 移除
                            variant: link
                            size: small
                            danger: true
                          events:
                            onClick:
                              - id: removeRouteCfm
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: 确认移除路由授权
                                    width: 480
                                    content:
                                      type: Flex
                                      props:
                                        direction: vertical
                                        gap: middle
                                      children:
                                        - type: Text
                                          props:
                                            size: small
                                            text: 移除后，该主体对「${parent.row.name}」（${parent.row.path}）的调用将被拒绝；重新添加授权即可恢复。
                                        - type: Flex
                                          props:
                                            justify: end
                                            gap: middle
                                          children:
                                            - type: Button
                                              props:
                                                text: 取消
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                            - type: Button
                                              props:
                                                text: 确认移除
                                                variant: primary
                                                danger: true
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                                    params:
                                                      payload:
                                                        ok: true
                              - action: if
                                params:
                                  condition: ${actions.removeRouteCfm.ok}
                                  then:
                                    - action: clientRoutes.remove
                                      params:
                                        routeId: ${row.routeId}
                                    - action: message
                                      params:
                                        messageType: success
                                        text: 已移除路由授权
                - type: Text
                  when: ${state.record.authRoutes.length == 0}
                  props:
                    text: 尚未授权路由；未授权 Route 拒绝调用。
                    type: secondary
            - type: Card
              props:
                title: ④ 配额策略
              children:
                - type: Flex
                  props:
                    direction: vertical
                    gap: middle
                    align: stretch
                  children:
                    - type: Flex
                      props:
                        justify: space-between
                        align: center
                      children:
                        - type: Text
                          props:
                            text: 可配置多条；总配额与周期循环可并存。
                            type: secondary
                        - type: Button
                          props:
                            text: + 添加配额规则
                            size: small
                          events:
                            onClick:
                              - id: addQuota
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: 添加配额规则
                                    width: 560
                                    content:
                                      type: Form
                                      props:
                                        name: quotaRule
                                        initialValues:
                                          quotaType: lifetime
                                          metric: TOTAL_TOKEN
                                          cycle: hour24
                                          mode: soft
                                      events:
                                        onSubmit:
                                          - action: policy.upsertQuota
                                            params:
                                              quota: ${event}
                                          - action: overlay.close
                                          - action: message
                                            params:
                                              messageType: success
                                              text: 配额规则已保存
                                      children:
                                        - type: Flex
                                          props:
                                            direction: vertical
                                            gap: middle
                                            align: stretch
                                          children:
                                            - type: Field
                                              props:
                                                label: 规则名称
                                                required: true
                                              children:
                                                - type: Input
                                                  props:
                                                    name: name
                                                    className: w-full
                                                    placeholder: 如 daily-token-cap
                                                    rules:
                                                      - required: true
                                                        message: 请输入规则名称
                                            - type: Field
                                              props:
                                                label: 配额类型
                                                required: true
                                              children:
                                                - type: RadioGroup
                                                  props:
                                                    name: quotaType
                                                    direction: horizontal
                                                    options:
                                                      - label: 总配额
                                                        value: lifetime
                                                      - label: 周期循环配额
                                                        value: cyclic
                                            - type: Field
                                              props:
                                                label: 计量指标
                                                labelHint: 并发控制请使用下方限流策略（Concurrent）
                                                required: true
                                              children:
                                                - type: Select
                                                  props:
                                                    name: metric
                                                    className: w-full
                                                    options:
                                                      - label: Request
                                                        value: REQUEST
                                                      - label: Input Token
                                                        value: INPUT_TOKEN
                                                      - label: Output Token
                                                        value: OUTPUT_TOKEN
                                                      - label: Total Token
                                                        value: TOTAL_TOKEN
                                                      - label: Cost
                                                        value: COST
                                            - type: Field
                                              props:
                                                label: 上限
                                                required: true
                                              children:
                                                - type: NumberInput
                                                  props:
                                                    name: limit
                                                    className: w-full
                                                    min: 1
                                                    precision: 0
                                                    placeholder: 如 500000
                                                    rules:
                                                      - required: true
                                                        message: 请输入上限
                                            - type: Field
                                              props:
                                                label: 循环周期（仅周期循环配额）
                                              children:
                                                - type: RadioGroup
                                                  props:
                                                    name: cycle
                                                    direction: vertical
                                                    options:
                                                      - label: 每 24 小时
                                                        value: hour24
                                                      - label: 每 7 天
                                                        value: day7
                                                      - label: 每月（自然月，每月 1 日 00:00 重置）
                                                        value: month
                                            - type: Field
                                              props:
                                                label: 模式
                                                required: true
                                              children:
                                                - type: Select
                                                  props:
                                                    name: mode
                                                    className: w-full
                                                    options:
                                                      - label: Soft Limit
                                                        value: soft
                                                      - label: Hard Limit
                                                        value: hard
                                            - type: Flex
                                              props:
                                                justify: end
                                                gap: middle
                                              children:
                                                - type: Button
                                                  props:
                                                    text: 取消
                                                  events:
                                                    onClick:
                                                      - action: overlay.close
                                                - type: Button
                                                  props:
                                                    text: 保存
                                                    variant: primary
                                                    submit: true
                    - type: Table
                      when: ${state.record.quotas.length > 0}
                      props:
                        dataSource: ${state.record.quotas}
                        rowKey: name
                        pagination: false
                        className: mt-2
                        columns:
                          - title: 规则名称
                            dataIndex: name
                          - title: 配额类型
                            dataIndex: quotaTypeLabel
                          - title: 计量指标
                            dataIndex: metricLabel
                          - title: 上限
                            dataIndex: limitText
                          - title: 循环周期
                            cell:
                              type: Text
                              props:
                                text: "${row.cycleLabel == null ? '—' : row.cycleLabel}"
                          - title: 模式
                            dataIndex: modeLabel
                          - title: 状态
                            cell:
                              type: StatusBadge
                              props:
                                status: ${row.status}
                          - title: 操作
                            align: center
                            width: 130
                            cell:
                              type: Flex
                              props:
                                gap: small
                                justify: center
                              children:
                                - type: Button
                                  props:
                                    text: 编辑
                                    variant: link
                                    size: small
                                    className: p-0 h-auto
                                  events:
                                    onClick:
                                      - id: editQuota
                                        action: overlay.open
                                        params:
                                          overlay:
                                            type: modal
                                            title: 编辑配额规则
                                            width: 560
                                            content:
                                              type: Form
                                              props:
                                                  name: quotaRule
                                                  initialValues:
                                                    name: ${parent.row.name}
                                                    quotaType: ${parent.row.quotaType}
                                                    metric: ${parent.row.metric}
                                                    limit: ${parent.row.limit}
                                                    mode: ${parent.row.mode}
                                                    cycle: "${parent.row.cycleUnit == 'month' ? 'month' : parent.row.cycleUnit == 'day' ? 'day7' : 'hour24'}"
                                              events:
                                                onSubmit:
                                                    - action: policy.upsertQuota
                                                      params:
                                                        original: ${parent.row.name}
                                                        quota: ${event}
                                                    - action: overlay.close
                                                    - action: message
                                                      params:
                                                        messageType: success
                                                        text: 配额规则已更新
                                              children:
                                                - type: Flex
                                                  props:
                                                    direction: vertical
                                                    gap: middle
                                                    align: stretch
                                                  children:
                                                    - type: Field
                                                      props:
                                                        label: 规则名称
                                                        required: true
                                                      children:
                                                        - type: Input
                                                          props:
                                                            name: name
                                                            className: w-full
                                                            placeholder: 如 daily-token-cap
                                                            rules:
                                                              - required: true
                                                                message: 请输入规则名称
                                                    - type: Field
                                                      props:
                                                        label: 配额类型
                                                        required: true
                                                      children:
                                                        - type: RadioGroup
                                                          props:
                                                            name: quotaType
                                                            direction: horizontal
                                                            options:
                                                              - label: 总配额
                                                                value: lifetime
                                                              - label: 周期循环配额
                                                                value: cyclic
                                                    - type: Field
                                                      props:
                                                        label: 计量指标
                                                        labelHint: 并发控制请使用下方限流策略（Concurrent）
                                                        required: true
                                                      children:
                                                        - type: Select
                                                          props:
                                                            name: metric
                                                            className: w-full
                                                            options:
                                                              - label: Request
                                                                value: REQUEST
                                                              - label: Input Token
                                                                value: INPUT_TOKEN
                                                              - label: Output Token
                                                                value: OUTPUT_TOKEN
                                                              - label: Total Token
                                                                value: TOTAL_TOKEN
                                                              - label: Cost
                                                                value: COST
                                                    - type: Field
                                                      props:
                                                        label: 上限
                                                        required: true
                                                      children:
                                                        - type: NumberInput
                                                          props:
                                                            name: limit
                                                            className: w-full
                                                            min: 1
                                                            precision: 0
                                                            placeholder: 如 500000
                                                            rules:
                                                              - required: true
                                                                message: 请输入上限
                                                    - type: Field
                                                      props:
                                                        label: 循环周期（仅周期循环配额）
                                                      children:
                                                        - type: RadioGroup
                                                          props:
                                                            name: cycle
                                                            direction: vertical
                                                            options:
                                                              - label: 每 24 小时
                                                                value: hour24
                                                              - label: 每 7 天
                                                                value: day7
                                                              - label: 每月（自然月，每月 1 日 00:00 重置）
                                                                value: month
                                                    - type: Field
                                                      props:
                                                        label: 模式
                                                        required: true
                                                      children:
                                                        - type: Select
                                                          props:
                                                            name: mode
                                                            className: w-full
                                                            options:
                                                              - label: Soft Limit
                                                                value: soft
                                                              - label: Hard Limit
                                                                value: hard
                                                    - type: Flex
                                                      props:
                                                        justify: end
                                                        gap: middle
                                                      children:
                                                        - type: Button
                                                          props:
                                                            text: 取消
                                                          events:
                                                            onClick:
                                                              - action: overlay.close
                                                        - type: Button
                                                          props:
                                                            text: 保存
                                                            variant: primary
                                                            submit: true
                                - type: Button
                                  props:
                                    text: 删除
                                    variant: link
                                    size: small
                                    danger: true
                                    className: p-0 h-auto
                                  events:
                                    onClick:
                                      - id: delQuotaCfm
                                        action: overlay.open
                                        params:
                                          overlay:
                                            type: modal
                                            title: 确认删除配额规则
                                            width: 480
                                            content:
                                              type: Flex
                                              props:
                                                direction: vertical
                                                gap: middle
                                              children:
                                                - type: Text
                                                  props:
                                                    size: small
                                                    text: 删除后，配额规则「${parent.row.name}」将立即失效且不可恢复。
                                                - type: Flex
                                                  props:
                                                    justify: end
                                                    gap: middle
                                                  children:
                                                    - type: Button
                                                      props:
                                                        text: 取消
                                                      events:
                                                        onClick:
                                                          - action: overlay.close
                                                    - type: Button
                                                      props:
                                                        text: 确认删除
                                                        variant: primary
                                                        danger: true
                                                      events:
                                                        onClick:
                                                          - action: overlay.close
                                                            params:
                                                              payload:
                                                                ok: true
                                      - action: if
                                        params:
                                          condition: ${actions.delQuotaCfm.ok}
                                          then:
                                            - action: policy.removeQuota
                                              params:
                                                name: ${row.name}
                                            - action: message
                                              params:
                                                messageType: success
                                                text: 已删除配额规则
                    - type: Text
                      when: ${state.record.quotas.length == 0}
                      props:
                        text: 尚未配置配额规则。
                        type: secondary
                    - type: Text
                      props:
                        text: ℹ 运行计数由 Runtime 维护，控制台近实时展示，Counter 不写入业务库
                        type: secondary
                        size: small
            - type: Card
              props:
                title: ⑤ 限流策略
              children:
                - type: Flex
                  props:
                    direction: vertical
                    gap: middle
                    align: stretch
                  children:
                    - type: Flex
                      props:
                        justify: space-between
                        align: center
                      children:
                        - type: Text
                          props:
                            text: 未配置规则时不限流；作用范围可取当前授权路由。
                            type: secondary
                        - type: Button
                          props:
                            text: + 添加限流规则
                            size: small
                          events:
                            onClick:
                              - action: policy.beginRateLimitAdd
                              - action: policy.scopeRouteOptions
                              - id: addRateLimit
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: 添加限流规则
                                    width: 560
                                    content:
                                      type: Form
                                      props:
                                        name: rateLimitRule
                                        initialValues:
                                          limitType: RPM
                                          scope: all
                                      events:
                                        onSubmit:
                                          - action: policy.upsertRateLimit
                                            params:
                                              rateLimit: ${event}
                                          - action: overlay.close
                                          - action: message
                                            params:
                                              messageType: success
                                              text: 限流规则已保存
                                      children:
                                        - type: Flex
                                          props:
                                            direction: vertical
                                            gap: middle
                                            align: stretch
                                          children:
                                            - type: Field
                                              props:
                                                label: 规则名称
                                                required: true
                                              children:
                                                - type: Input
                                                  props:
                                                    name: name
                                                    className: w-full
                                                    placeholder: 如 app-rpm
                                                    rules:
                                                      - required: true
                                                        message: 请输入规则名称
                                            - type: Field
                                              props:
                                                label: 限流类型
                                                required: true
                                              children:
                                                - type: Select
                                                  props:
                                                    name: limitType
                                                    className: w-full
                                                    options:
                                                      - label: RPM（每分钟请求数）
                                                        value: RPM
                                                      - label: TPM（每分钟 Token 数）
                                                        value: TPM
                                                      - label: Concurrent（并发连接数）
                                                        value: CONCURRENT
                                            - type: Field
                                              props:
                                                label: 上限
                                                required: true
                                              children:
                                                - type: NumberInput
                                                  props:
                                                    name: limit
                                                    className: w-full
                                                    min: 1
                                                    precision: 0
                                                    placeholder: 如 1000
                                                    rules:
                                                      - required: true
                                                        message: 请输入上限
                                            - type: Field
                                              props:
                                                label: Burst（Concurrent 时不适用）
                                              children:
                                                - type: NumberInput
                                                  props:
                                                    name: burst
                                                    className: w-full
                                                    min: 1
                                                    precision: 0
                                                    placeholder: 可选，如 100
                                            - type: Field
                                              props:
                                                label: 作用范围
                                              children:
                                                - type: RadioGroup
                                                  props:
                                                    name: scope
                                                    direction: horizontal
                                                    options:
                                                      - label: 全部授权路由
                                                        value: all
                                                      - label: 指定路由
                                                        value: routes
                                                  events:
                                                    onChange:
                                                      - action: setState
                                                        params:
                                                          rateLimitScope: ${event}
                                            - type: Flex
                                              when: ${state.rateLimitScope == 'routes'}
                                              props:
