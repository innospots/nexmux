                                                            placeholder: 选择授权路由（来自当前授权列表）
                                                            options: ${state.scopeRouteOptions}
                                                            controlClassName: w-full [&_[data-slot=select-trigger]]:w-full
                                                          events:
                                                            onChange:
                                                              - action: setState
                                                                params:
                                                                  pendingScopeRouteId: ${event}
                                                        - type: Button
                                                          props:
                                                            text: 添加
                                                            size: small
                                                          events:
                                                            onClick:
                                                              - action: policy.addScopeRoute
                                                                params:
                                                                  routeId: ${state.pendingScopeRouteId}
                                                    - type: Table
                                                      when: ${state.pendingScopeRoutes.length > 0}
                                                      props:
                                                        dataSource: ${state.pendingScopeRoutes}
                                                        rowKey: routeId
                                                        pagination: false
                                                        columns:
                                                          - title: 路由名称
                                                            dataIndex: name
                                                          - title: 操作
                                                            align: center
                                                            width: 80
                                                            cell:
                                                              type: Button
                                                              props:
                                                                text: 移除
                                                                variant: link
                                                                size: small
                                                                danger: true
                                                                className: p-0 h-auto
                                                              events:
                                                                onClick:
                                                                  - action: policy.removeScopeRoute
                                                                    params:
                                                                      routeId: ${row.routeId}
                                                - type: Flex
                                                  props:
                                                    justify: end
                                                    gap: middle
                                                  children:
                                                    - type: Button
                                                      props:
                                                        text: 取消
                                                      events:
                                                        onClick:
                                                          - action: overlay.close
                                                    - type: Button
                                                      props:
                                                        text: 保存
                                                        variant: primary
                                                        submit: true
                            - type: Button
                              props:
                                text: 删除
                                variant: link
                                size: small
                                danger: true
                                className: p-0 h-auto
                              events:
                                onClick:
                                  - id: delRateLimitCfm
                                    action: overlay.open
                                    params:
                                      overlay:
                                        type: modal
                                        title: 确认删除限流规则
                                        width: 480
                                        content:
                                          type: Flex
                                          props:
                                            direction: vertical
                                            gap: middle
                                          children:
                                            - type: Text
                                              props:
                                                size: small
                                                text: 删除后，限流规则「${parent.row.name}」将立即失效且不可恢复。
                                            - type: Flex
                                              props:
                                                justify: end
                                                gap: middle
                                              children:
                                                - type: Button
                                                  props:
                                                    text: 取消
                                                  events:
                                                    onClick:
                                                      - action: overlay.close
                                                - type: Button
                                                  props:
                                                    text: 确认删除
                                                    variant: primary
                                                    danger: true
                                                  events:
                                                    onClick:
                                                      - action: overlay.close
                                                        params:
                                                          payload:
                                                            ok: true
                                  - action: if
                                    params:
                                      condition: ${actions.delRateLimitCfm.ok}
                                      then:
                                        - action: policy.removeRateLimit
                                          params:
                                            name: ${row.name}
                                        - id: persistResult
                                          action: policy.persist
                                          params:
                                            url: /api/d/clients/${data.detail.id}
                                        - action: if
                                          params:
                                            condition: ${actions.persistResult == null || actions.persistResult.ok == false}
                                            then:
                                              - action: message
                                                params:
                                                  messageType: error
                                                  text: "${actions.persistResult != null && actions.persistResult.error != null ? actions.persistResult.error.message : '保存失败，请重试'}"
                                        - action: if
                                          params:
                                            condition: ${actions.persistResult != null && actions.persistResult.ok != false}
                                            then:
                                              - action: reload
                                                params:
                                                  dataSource: detail
                                              - action: message
                                                params:
                                                  messageType: success
                                                  text: 已删除限流规则
                - type: Text
                  when: ${state.record.rateLimits.length == 0}
                  props:
                    text: 尚未配置限流规则。
                    type: secondary
        - type: Button
          props:
            text: 返回列表
            variant: primary
          events:
            onClick:
              - action: navigate
                params:
                  to: /clients

