dsl: "1.0"
page:
  id: client-template-detail
  title: 客户端模板详情
  name: clientTemplateDetail
  description: 访问治理 / 客户端模板详情：基本信息、路由授权、配额与限流策略（单页纵向，无 Tab，无 AppKey）
state:
  pendingRouteId: ""
  routeOptions: []
  routeOptionRows: []
  pendingScopeRouteId: ""
  pendingScopeRoutes: []
  scopeRouteOptions: []
  rateLimitScope: all
  record:
    authRoutes: []
    quotas: []
    rateLimits: []
dataSources:
  detail:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/client-templates/${route.params.code}
  createdClients:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/client-templates/${route.params.code}/created-clients
lifecycle:
  onLoad:
    - action: if
      params:
        condition: ${data.detail != null}
        then:
          - action: setState
            params:
              record: ${data.detail}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 访问治理
          - label: 客户端模板
            href: /client-templates
          - label: ${route.params.code}
    - type: Flex
      when: ${data.detail != null}
      props:
        direction: vertical
        gap: middle
        align: stretch
      children:
        - type: Card
          children:
            - type: Flex
              props:
                justify: space-between
                align: middle
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        justify: center
                        className: size-12 shrink-0 rounded-full bg-(--muted)
                      children:
                        - type: Icon
                          props:
                            name: bookmark
                            size: 24
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 0
                      children:
                        - type: Flex
                          props:
                            align: center
                            gap: middle
                          children:
                            - type: Typography
                              props:
                                variant: h3
                                text: ${data.detail.name}
                            - type: StatusBadge
                              props:
                                status: ${data.detail.status}
                        - type: Text
                          props:
                            text: ${data.detail.tagsText} · 有效期 ${data.detail.validityLabel} ·
                              ${data.detail.routeCount} 路由
                            type: secondary
                - type: Flex
                  props:
                    align: center
                    gap: small
                  children:
                    - type: Button
                      props:
                        text: 编辑
                        icon: edit
                        variant: primary
                        size: small
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /client-templates/${route.params.code}/edit
                    - type: Button
                      props:
                        text: 创建客户端
                        icon: plus
                        size: small
                      events:
                        onClick:
                          - id: createClientCfm
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: 基于模板创建客户端 — ${data.detail.name}
                                width: 560
                                content:
                                  type: Form
                                  props:
                                    name: createClient
                                    initialValues:
                                      tags: ""
                                  events:
                                    onSubmit:
                                      - id: ccResult
                                        action: policy.submit
                                        params:
                                          mode: clientCreate
                                          url: /api/d/clients
                                          sourceTemplateCode: ${route.params.code}
                                          values: ${event}
                                      - action: if
                                        params:
                                          condition: ${actions.ccResult == null || actions.ccResult.ok == false}
                                          then:
                                            - action: message
                                              params:
                                                messageType: error
                                                text: "${actions.ccResult != null && actions.ccResult.error != null ? actions.ccResult.error.message : '创建失败'}"
                                      - action: if
                                        params:
                                          condition: ${actions.ccResult != null && actions.ccResult.ok != false}
                                          then:
                                            - action: overlay.close
                                            - id: appKeyShown
                                              action: overlay.open
                                              params:
                                                overlay:
                                                  type: modal
                                                  title: 客户端已创建 — 保存 AppKey
                                                  width: 520
                                                  content:
                                                    type: Flex
                                                    props:
                                                      direction: vertical
                                                      gap: middle
                                                    children:
                                                      - type: Alert
                                                        props:
                                                          showIcon: true
                                                          variant: warning
                                                          message: AppKey Secret 仅此一次展示，请立即复制保存。
                                                      - type: Flex
                                                        props:
                                                          direction: vertical
                                                          gap: small
                                                        children:
                                                          - type: Text
                                                            props:
                                                              size: small
                                                              type: secondary
                                                              text: AppKey ID
                                                          - type: Text
                                                            props:
                                                              strong: true
                                                              className: font-mono
                                                              text: ${actions.ccResult.data.client.appKeyId}
                                                          - type: Text
                                                            props:
                                                              size: small
                                                              type: secondary
                                                              text: AppKey Secret
                                                          - type: Text
                                                            props:
                                                              strong: true
                                                              className: font-mono
                                                              text: ${actions.ccResult.data.appKeyPlaintext}
                                                      - type: Flex
                                                        props:
                                                          justify: end
                                                        children:
                                                          - type: Button
                                                            props:
                                                              text: 我已保存
                                                              variant: primary
                                                            events:
                                                              onClick:
                                                                - action: overlay.close
                                            - action: navigate
                                              params:
                                                to: /clients
                                  children:
                                    - type: Flex
                                      props:
                                        direction: vertical
                                        gap: middle
                                        align: stretch
                                      children:
                                        - type: Alert
                                          props:
                                            showIcon: true
                                            variant: info
                                            message: 继承：路由 · 配额 · 限流 · 默认有效期 · 标签（可选继承）
                                        - type: Field
                                          props:
                                            label: 客户端名称
                                            required: true
                                          children:
                                            - type: Input
                                              props:
                                                name: name
                                                className: w-full
                                                placeholder: 如 agent-zhangsan
                                                rules:
                                                  - required: true
                                                    message: 请输入客户端名称
                                        - type: Field
                                          props:
                                            label: 客户端标识
                                            required: true
                                          children:
                                            - type: Input
                                              props:
                                                name: code
                                                className: w-full
                                                placeholder: 小写 + 数字 + 连字符，如 agent-zhangsan
                                                rules:
                                                  - required: true
                                                    message: 请输入客户端标识
                                        - type: Field
                                          props:
                                            label: 标签
                                          children:
                                            - type: Input
                                              props:
                                                name: tags
                                                className: w-full
                                                placeholder: 逗号分隔，如 agent, prod
                                            - type: Text
                                              props:
                                                text: 默认带入模板标签，可改
                                                type: secondary
                                                className: text-xs
                                        - type: Flex
                                          props:
                                            justify: end
                                            gap: middle
                                          children:
                                            - type: Button
                                              props:
                                                text: 取消
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                            - type: Button
                                              props:
                                                text: 确认创建
                                                variant: primary
                                                submit: true
                    - type: Button
                      props:
                        text: "${data.detail.status == 'enabled' ? '停用' : '启用'}"
                        icon: "${data.detail.status == 'enabled' ? 'x-circle' : 'check-circle'}"
                        size: small
                      events:
                        onClick:
                          - id: statusCfm
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: "${data.detail.status == 'enabled' ? '确认停用模板' : '确认启用模板'}"
                                width: 480
                                content:
                                  type: Flex
                                  props:
                                    direction: vertical
                                    gap: middle
                                  children:
                                    - type: Text
                                      props:
                                        size: small
                                        text: "${data.detail.status == 'enabled' ? '停用后，不可基于该模板创建客户端；已创建客户端的调用不受影响。' :
                                          '启用后，可基于该模板创建客户端（创建时生成 AppKey）。'}"
                                    - type: Flex
                                      props:
                                        direction: vertical
                                        gap: small
                                      children:
                                        - type: Text
                                          props:
                                            text: 影响范围：
                                            strong: true
                                        - type: Text
                                          props:
                                            text: · 已创建客户端：${data.detail.createdClientCount} 个
                                            type: secondary
                                        - type: Text
                                          props:
                                            text: · 授权路由：${data.detail.routeCount} 条
                                            type: secondary
                                    - type: Text
                                      when: ${data.detail.status == 'enabled' && data.detail.createdClientCount > 0}
                                      props:
                                        size: small
                                        text: ⚠ 停用仅阻止基于模板新建客户端，不回溯已创建的客户端。
                                        type: warning
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: middle
                                      children:
                                        - type: Button
                                          props:
                                            text: 取消
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: "${data.detail.status == 'enabled' ? '确认停用' : '确认启用'}"
                                            variant: primary
                                            danger: ${data.detail.status == 'enabled'}
                                          events:
                                            onClick:
                                              - action: overlay.close
                                                params:
                                                  payload:
                                                    ok: true
                          - action: if
                            params:
                              condition: ${actions.statusCfm.ok}
                              then:
                                - id: statusResult
                                  action: util.request
                                  params:
                                    method: POST
                                    url: "/api/d/client-templates/${data.detail.id}/${data.detail.status == 'enabled' ? 'disable' : 'enable'}"
                                    body: {}
                                - action: if
                                  params:
                                    condition: ${actions.statusResult == null || actions.statusResult.ok == false}
                                    then:
                                      - action: message
                                        params:
                                          messageType: error
                                          text: "${actions.statusResult != null && actions.statusResult.error != null ? actions.statusResult.error.message : '操作失败'}"
                                - action: if
                                  params:
                                    condition: ${actions.statusResult != null && actions.statusResult.ok != false}
                                    then:
                                      - action: message
                                        params:
                                          messageType: success
                                          text: "${data.detail.status == 'enabled' ? '已停用' : '已启用'}"
                                      - action: reload
                                        params:
                                          dataSource: detail
                    - type: DropdownMenu
                      props:
                        items:
                          - label: 复制模板标识
                            value: copy
                            icon: copy
                          - label: 导出配置 JSON
                            value: export
                            icon: download
                      events:
                        onSelect:
                          - action: if
                            params:
                              condition: ${event == 'copy'}
                              then:
                                - action: util.copy
                                  params:
                                    text: ${data.detail.code}
                                - action: message
                                  params:
                                    messageType: success
                                    text: 模板标识已复制
                          - action: if
                            params:
                              condition: ${event == 'export'}
                              then:
                                - action: util.copyJson
                                  params:
                                    data: ${data.detail}
                                - action: message
                                  params:
                                    messageType: success
                                    text: 配置 JSON 已复制到剪贴板
                      children:
                        - type: Button
                          props:
                            text: ···
                            variant: text
        - type: Card
          props:
            title: ① 基本信息
          children:
            - type: Flex
              props:
                direction: vertical
                gap: middle
                align: stretch
              children:
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 名称
                        type: secondary
                        style:
                          width: 120
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.name}
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 标识
                        type: secondary
                        style:
                          width: 120
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.code}（创建后不可修改）
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 有效期
                        type: secondary
                        style:
                          width: 120
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.validityLabel}
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 标签
                        type: secondary
                        style:
                          width: 120
                          flexShrink: 0
                    - type: Text
                      props:
                        text: "${data.detail.tagsText != '' ? data.detail.tagsText : '—'}"
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 描述
                        type: secondary
                        style:
                          width: 120
                          flexShrink: 0
                    - type: Text
                      props:
                        text: "${data.detail.description != '' ? data.detail.description : '—'}"
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 状态
                        type: secondary
                        style:
                          width: 120
                          flexShrink: 0
                    - type: StatusBadge
                      props:
                        status: ${data.detail.status}
        - type: Card
          props:
            title: ③ 路由授权
          children:
            - type: Flex
              props:
                justify: space-between
                align: center
              children:
                - type: Text
                  props:
                    text: 未授权 Route 拒绝调用。
                    type: secondary
                - type: Button
                  props:
                    text: + 添加路由
                    size: small
                  events:
                    onClick:
                      - id: routeOpts
                        action: clientRoutes.loadOptions
                      - id: addRoute
                        action: overlay.open
                        params:
                          overlay:
                            type: modal
                            title: 添加路由授权
                            width: 640
                            content:
                              type: Flex
                              props:
                                direction: vertical
                                gap: middle
                                align: stretch
                              children:
                                - type: Field
                                  props:
                                    label: 可选路由（仅已启用）
                                    required: true
                                  children:
                                    - type: Select
                                      props:
                                        value: ${state.pendingRouteId}
                                        placeholder: 选择要授权的路由
                                        options: ${state.routeOptions}
                                        controlClassName: w-full [&_[data-slot=select-trigger]]:w-full
                                      events:
                                        onChange:
                                          - action: setState
                                            params:
                                              pendingRouteId: ${event}
                                - type: Flex
                                  props:
                                    justify: end
                                    gap: middle
                                  children:
                                    - type: Button
                                      props:
                                        text: 取消
                                      events:
                                        onClick:
                                          - action: overlay.close
                                    - type: Button
                                      props:
                                        text: 确认添加
                                        variant: primary
                                      events:
                                        onClick:
                                          - action: clientRoutes.add
                                            params:
                                              routeId: ${state.pendingRouteId}
                                          - action: overlay.close
                                          - id: persistResult
                                            action: policy.persist
                                            params:
                                              kind: template
                                              url: /api/d/client-templates/${data.detail.id}
                                          - action: if
                                            params:
                                              condition: ${actions.persistResult == null || actions.persistResult.ok == false}
                                              then:
                                                - action: message
                                                  params:
                                                    messageType: error
                                                    text: "${actions.persistResult != null && actions.persistResult.error != null ? actions.persistResult.error.message : '保存失败，请重试'}"
                                          - action: if
                                            params:
                                              condition: ${actions.persistResult != null && actions.persistResult.ok != false}
                                              then:
                                                - action: reload
                                                  params:
                                                    dataSource: detail
                                                - action: message
                                                  params:
                                                    messageType: success
                                                    text: 已添加路由授权
            - type: Table
              props:
                dataSource: ${state.record.authRoutes}
                rowKey: code
                pagination: false
                className: mt-2
                columns:
                  - title: 路由名称
                    cell:
                      type: Button
                      props:
                        text: ${row.name}
                        variant: link
                        size: small
                        className: p-0 h-auto
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /routes/${row.code}
                  - title: Alias
                    dataIndex: alias
                  - title: 类型
                    dataIndex: typeLabel
                  - title: 请求路径
                    dataIndex: path
                  - title: 操作
                    align: center
                    width: 80
                    cell:
                      type: Button
                      props:
                        text: 移除
                        variant: link
                        size: small
                        danger: true
                      events:
                        onClick:
                          - id: removeRouteCfm
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: 确认移除路由授权
                                width: 480
                                content:
                                  type: Flex
                                  props:
                                    direction: vertical
                                    gap: middle
                                  children:
                                    - type: Text
                                      props:
                                        size: small
                                        text: 移除后，该主体对「${parent.row.name}」（${parent.row.path}）的调用将被拒绝；重新添加授权即可恢复。
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: middle
                                      children:
                                        - type: Button
                                          props:
                                            text: 取消
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: 确认移除
                                            variant: primary
                                            danger: true
                                          events:
                                            onClick:
                                              - action: overlay.close
                                                params:
                                                  payload:
                                                    ok: true
                          - action: if
                            params:
                              condition: ${actions.removeRouteCfm.ok}
                              then:
                                - action: clientRoutes.remove
                                  params:
                                    routeId: ${row.routeId}
                                - id: persistResult
                                  action: policy.persist
                                  params:
                                    kind: template
                                    url: /api/d/client-templates/${data.detail.id}
                                - action: if
                                  params:
                                    condition: ${actions.persistResult == null || actions.persistResult.ok == false}
                                    then:
                                      - action: message
                                        params:
                                          messageType: error
                                          text: "${actions.persistResult != null && actions.persistResult.error != null ? actions.persistResult.error.message : '保存失败，请重试'}"
                                - action: if
                                  params:
                                    condition: ${actions.persistResult != null && actions.persistResult.ok != false}
                                    then:
                                      - action: reload
                                        params:
                                          dataSource: detail
                                      - action: message
                                        params:
                                          messageType: success
                                          text: 已移除路由授权
            - type: Text
              when: ${state.record.authRoutes.length == 0}
              props:
                text: 尚未授权路由；未授权 Route 拒绝调用。
                type: secondary
        - type: Card
          props:
            title: ④ 配额策略
          children:
            - type: Flex
              props:
                direction: vertical
                gap: middle
                align: stretch
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: center
                  children:
                    - type: Text
                      props:
                        text: 可配置多条；总配额与周期循环可并存。
                        type: secondary
                    - type: Button
                      props:
                        text: + 添加配额规则
                        size: small
                      events:
                        onClick:
                          - id: addQuota
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: 添加配额规则
                                width: 560
                                content:
                                  type: Form
                                  props:
                                    name: quotaRule
                                    initialValues:
                                      quotaType: lifetime
                                      metric: TOTAL_TOKEN
                                      cycle: hour24
                                      mode: soft
                                  events:
                                    onSubmit:
                                      - action: policy.upsertQuota
                                        params:
                                          quota: ${event}
                                      - action: overlay.close
                                      - id: persistResult
                                        action: policy.persist
                                        params:
                                          kind: template
                                          url: /api/d/client-templates/${data.detail.id}
                                      - action: if
                                        params:
                                          condition: ${actions.persistResult == null || actions.persistResult.ok == false}
                                          then:
                                            - action: message
                                              params:
                                                messageType: error
                                                text: "${actions.persistResult != null && actions.persistResult.error != null ? actions.persistResult.error.message : '保存失败，请重试'}"
                                      - action: if
                                        params:
                                          condition: ${actions.persistResult != null && actions.persistResult.ok != false}
                                          then:
                                            - action: reload
                                              params:
                                                dataSource: detail
                                            - action: message
                                              params:
                                                messageType: success
                                                text: 配额规则已保存
                                  children:
                                    - type: Flex
                                      props:
                                        direction: vertical
                                        gap: middle
                                        align: stretch
                                      children:
                                        - type: Field
                                          props:
                                            label: 规则名称
                                            required: true
                                          children:
                                            - type: Input
                                              props:
                                                name: name
                                                className: w-full
                                                placeholder: 如 daily-token-cap
                                                rules:
                                                  - required: true
                                                    message: 请输入规则名称
                                        - type: Field
                                          props:
                                            label: 配额类型
                                            required: true
                                          children:
                                            - type: RadioGroup
                                              props:
                                                name: quotaType
                                                direction: horizontal
                                                options:
                                                  - label: 总配额
                                                    value: lifetime
                                                  - label: 周期循环配额
                                                    value: cyclic
                                        - type: Field
                                          props:
                                            label: 计量指标
                                            required: true
                                          children:
                                            - type: Select
                                              props:
                                                name: metric
                                                className: w-full
                                                options:
                                                  - label: Request
                                                    value: REQUEST
                                                  - label: Input Token
                                                    value: INPUT_TOKEN
                                                  - label: Output Token
                                                    value: OUTPUT_TOKEN
                                                  - label: Total Token
                                                    value: TOTAL_TOKEN
                                                  - label: Cost
                                                    value: COST
                                                  - label: Concurrent
                                                    value: CONCURRENT
                                        - type: Field
                                          props:
                                            label: 上限
                                            required: true
                                          children:
                                            - type: NumberInput
                                              props:
                                                name: limit
                                                className: w-full
                                                min: 1
                                                precision: 0
                                                placeholder: 如 500000
                                                rules:
                                                  - required: true
                                                    message: 请输入上限
                                        - type: Field
                                          props:
                                            label: 循环周期（仅周期循环配额）
                                          children:
                                            - type: RadioGroup
                                              props:
                                                name: cycle
                                                direction: vertical
                                                options:
                                                  - label: 每 24 小时
                                                    value: hour24
                                                  - label: 每 7 天
                                                    value: day7
                                                  - label: 每月（自然月，每月 1 日 00:00 重置）
                                                    value: month
                                        - type: Field
                                          props:
                                            label: 模式
                                            required: true
                                          children:
                                            - type: Select
                                              props:
                                                name: mode
                                                className: w-full
                                                options:
                                                  - label: Soft Limit
                                                    value: soft
