                                            condition: ${actions.persistResult == null || actions.persistResult.ok == false}
                                            then:
                                              - action: message
                                                params:
                                                  messageType: error
                                                  text: "${actions.persistResult != null && actions.persistResult.error != null ? actions.persistResult.error.message : '保存失败，请重试'}"
                                        - action: if
                                          params:
                                            condition: ${actions.persistResult != null && actions.persistResult.ok != false}
                                            then:
                                              - action: reload
                                                params:
                                                  dataSource: detail
                                              - action: message
                                                params:
                                                  messageType: success
                                                  text: 已删除限流规则
                - type: Text
                  when: ${state.record.rateLimits.length == 0}
                  props:
                    text: 尚未配置限流规则。
                    type: secondary
        - type: Card
          props:
            title: 已创建客户端
          children:
            - type: Table
              props:
                dataSource: ${data.createdClients}
                rowKey: code
                pagination: false
                columns:
                  - title: 名称
                    cell:
                      type: Button
                      props:
                        text: ${row.name}
                        variant: link
                        size: small
                        className: p-0 h-auto
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /clients/${row.code}
                  - title: 标识
                    dataIndex: code
                  - title: 标签
                    dataIndex: tagsText
                  - title: 到期时间
                    dataIndex: expiresAt
                  - title: 状态
                    cell:
                      type: StatusBadge
                      props:
                        status: ${row.status}
                  - title: 操作
                    cell:
                      type: Button
                      props:
                        text: 查看客户端
                        variant: link
                        size: small
                        className: p-0 h-auto
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /clients/${row.code}
            - type: Text
              when: ${data.createdClients != null && data.createdClients.length == 0}
              props:
                text: 尚未基于本模板创建客户端
                type: secondary
    - type: Empty
      when: ${data.detail == null && !dataStatus.detail.loading}
      props:
        title: 未找到模板
        description: 模板标识「${route.params.code}」不存在或已被删除
      children:
        - type: Button
          props:
            text: 返回列表
            variant: primary
          events:
            onClick:
              - action: navigate
                params:
                  to: /client-templates

