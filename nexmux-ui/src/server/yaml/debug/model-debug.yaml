dsl: "1.0"
page:
  id: model-debug
  title: 模型调试
  name: modelDebug
  description: 调试台 / 模型调试：直连供应商模型，验证连通性与效果（Chat 对话式）
state:
  providerCode: ""
  modelCode: ""
  modelOptions: []
  testing: false
  conn: null
  systemPrompt: ""
  reasoningEffort: medium
  streamingOn: true
  toolsOn: false
  showReasoning: false
  canStream: true
  canTools: false
  messages: []
  streaming: false
dataSources:
  providerOptions:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/provider-options
body:
  type: Page
  props:
    className: debug-page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 调试台
          - label: 模型调试
    - type: Flex
      props:
        align: baseline
        gap: middle
      children:
        - type: Typography
          props:
            variant: h3
            text: 模型调试
        - type: Typography
          props:
            variant: muted
            text: 直连供应商模型，验证连通性与效果
    - type: Alert
      props:
        showIcon: true
        variant: info
        message: 模型调试在 Console 进程内直连上游 Binding（不经过 Route），会产生真实上游调用与费用；调试记录以 source=DEBUG 与真实流量区分。可在「系统管理 / 服务设置」关闭或限制日配额。
    - type: Flex
      props:
        className: debug-split
      children:
        - type: Flex
          props:
            direction: vertical
            className: debug-split-main
          children:
            - type: Card
              props:
                title: 对话记录
                className: debug-chat-card
              children:
                - type: DebugChat
                  props:
                    messages: ${state.messages}
                    sendDisabled: ${!state.providerCode || !state.modelCode}
                    placeholder: "${state.providerCode && state.modelCode ? '输入消息...' :
                      '请先在右侧选择供应商与模型'}"
                    streaming: ${state.streaming}
                    emptyHint: 选择右侧供应商与模型后发送消息，验证连通性与效果
                  events:
                    onSend:
                      - action: modelDebug.send
                        params:
                          text: ${event}
                    onStop:
                      - action: modelDebug.stop
                    onClear:
                      - action: modelDebug.clear
        - type: Flex
          props:
            direction: vertical
            gap: middle
            className: debug-split-side
          children:
            - type: Card
              props:
                title: 调用身份
                className: overflow-auto
              children:
                - type: Flex
                  props:
                    direction: vertical
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        gap: small
                      children:
                        - type: Text
                          props:
                            text: 供应商
                            strong: true
                            className: w-28 shrink-0 text-sm
                        - type: Select
                          props:
                            value: ${state.providerCode}
                            options: ${data.providerOptions.items}
                            placeholder: 选择供应商
                            className: flex-1 w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                          events:
                            onChange:
                              - action: modelDebug.selectProvider
                                params:
                                  providerCode: ${event}
                    - type: Flex
                      props:
                        align: center
                        gap: small
                      children:
                        - type: Text
                          props:
                            text: 模型
                            strong: true
                            className: w-28 shrink-0 text-sm
                        - type: Select
                          props:
                            value: ${state.modelCode}
                            options: ${state.modelOptions}
                            placeholder: 选择模型
                            disabled: ${!state.providerCode}
                            className: flex-1 w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                          events:
                            onChange:
                              - action: modelDebug.selectModel
                                params:
                                  modelCode: ${event}
                    - type: Flex
                      props:
                        className: pl-[120px]
                      children:
                        - type: Button
                          props:
                            text: 连接测试
                            size: small
                            loading: ${state.testing}
                            disabled: ${!state.providerCode || !state.modelCode}
                          events:
                            onClick:
                              - action: modelDebug.testConnection
                    - type: Separator
                    - type: Flex
                      props:
                        direction: vertical
                        gap: small
                      children:
                        - type: Text
                          props:
                            text: System Prompt
                            strong: true
                        - type: Textarea
                          props:
                            value: ${state.systemPrompt}
                            placeholder: （可选）会话级系统提示词
                            rows: 3
                            className: w-full
                          events:
                            onChange:
                              - action: setState
                                params:
                                  systemPrompt: ${event}
                    - type: Separator
                    - type: Flex
                      props:
                        direction: vertical
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: 模型参数
                            strong: true
                        - type: Flex
                          props:
                            align: center
                            gap: small
                          children:
                            - type: Text
                              props:
                                text: temperature
                                strong: true
                                className: w-28 shrink-0 text-sm
                            - type: NumberInput
                              props:
                                value: ${state.temperature}
                                min: 0
                                max: 2
                                step: 0.1
                                precision: 1
                                placeholder: 默认
                                className: flex-1 w-full
                              events:
                                onChange:
                                  - action: setState
                                    params:
                                      temperature: ${event}
                        - type: Flex
                          props:
                            align: center
                            gap: small
                          children:
                            - type: Text
                              props:
                                text: top_p
                                strong: true
                                className: w-28 shrink-0 text-sm
                            - type: NumberInput
                              props:
                                value: ${state.topP}
                                min: 0
                                max: 1
                                step: 0.1
                                precision: 1
                                placeholder: 默认
                                className: flex-1 w-full
                              events:
                                onChange:
                                  - action: setState
                                    params:
                                      topP: ${event}
                        - type: Flex
                          props:
                            align: center
                            gap: small
                          children:
                            - type: Text
                              props:
                                text: max_tokens
                                strong: true
                                className: w-28 shrink-0 text-sm
                            - type: NumberInput
                              props:
                                value: ${state.maxTokens}
                                min: 1
                                precision: 0
                                placeholder: 默认
                                className: flex-1 w-full
                              events:
                                onChange:
                                  - action: setState
                                    params:
                                      maxTokens: ${event}
                        - type: Flex
                          props:
                            align: center
                            gap: small
                          children:
                            - type: Text
                              props:
                                text: reasoning_effort
                                strong: true
                                className: w-28 shrink-0 text-sm
                            - type: Select
                              props:
                                value: ${state.reasoningEffort}
                                options:
                                  - value: low
                                    label: low
                                  - value: medium
                                    label: medium
                                  - value: high
                                    label: high
                                className: flex-1 w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                              events:
                                onChange:
                                  - action: setState
                                    params:
                                      reasoningEffort: ${event}
                          when: ${state.showReasoning}
                        - type: Flex
                          props:
                            align: center
                            gap: small
                          children:
                            - type: Text
                              props:
                                text: Streaming
                                strong: true
                                className: w-28 shrink-0 text-sm
                            - type: Switch
                              props:
                                value: ${state.streamingOn}
                                disabled: ${state.modelCode != '' && !state.canStream}
                              events:
                                onChange:
                                  - action: setState
                                    params:
                                      streamingOn: ${event}
                        - type: Flex
                          props:
                            align: center
                            gap: small
                          children:
                            - type: Text
                              props:
                                text: Tools
                                strong: true
                                className: w-28 shrink-0 text-sm
                            - type: Switch
                              props:
                                value: ${state.toolsOn}
                                disabled: ${!state.canTools}
                              events:
                                onChange:
                                  - action: setState
                                    params:
                                      toolsOn: ${event}
                        - type: Text
                          when: ${state.modelCode != '' && !state.canTools}
                          props:
                            text: 该模型不支持 Function Calling
                            type: secondary
                            className: block pl-[120px] text-xs
                    - type: Separator
                    - type: Flex
                      props:
                        align: center
                        gap: small
                      children:
                        - type: Text
                          props:
                            text: 连接状态：
                            type: secondary
                            className: text-sm
                        - type: Text
                          when: ${state.conn == null}
                          props:
                            text: 未测试
                            type: secondary
                            className: text-sm
                        - type: Text
                          when: ${state.conn != null && state.conn.ok}
                          props:
                            text: ● 正常　上次测试 ${state.conn.latencyMs}ms · ${state.conn.detail}
                            className: text-sm text-emerald-600
                        - type: Text
                          when: ${state.conn != null && !state.conn.ok}
                          props:
                            text: ● 异常　上次测试 ${state.conn.latencyMs}ms · ${state.conn.detail}
                            className: text-sm text-red-600
