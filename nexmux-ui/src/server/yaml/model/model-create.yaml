dsl: "1.0"
page:
  id: model-create
  title: 新增模型
  name: modelForm
  description: 创建或修改 Model：基本信息、默认参数与分档定价
dataSources:
  providerOptions:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/data/provider-options
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 模型资产
          - label: 模型
            href: /models
          - label: 新增模型
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: small
          children:
            - type: Typography
              props:
                variant: h3
                text: 新增模型
            - type: Typography
              props:
                variant: muted
                text: 定义对客户端暴露的模型：基本信息、默认执行参数与分档定价
    - type: Form
      props:
        layout: vertical
        initialValues:
          modelType: LLM
          status: enabled
          currency: USD
          inputModalities: text
          outputModalities: text
          metadata: |-
            {
              "vendor_tier": "standard"
            }
      events:
        onSubmit:
          - id: createResult
            action: request
            params:
              method: POST
              url: /api/data/models
              body: ${event}
          - action: if
            params:
              condition: ${actions.createResult == null || actions.createResult.ok == false}
              then:
                - action: message
                  params:
                    messageType: error
                    text: "${actions.createResult != null && actions.createResult.error != null ? actions.createResult.error.message
                      : '创建失败'}"
          - action: if
            params:
              condition: ${actions.createResult != null && actions.createResult.ok != false}
              then:
                - action: message
                  params:
                    messageType: success
                    text: 模型「${event.displayName}」已创建。建议下一步：确认定价与默认参数
                - action: navigate
                  params:
                    to: /models
      children:
        - type: Card
          children:
            - type: Tabs
              props:
                variant: line
                items:
                  - key: basic
                    label: 基本信息
                    className: p-2 pt-4
                    children:
                      - type: Grid
                        props:
                          columns: 2
                          gap: 16
                        children:
                          - type: Field
                            props:
                              label: Model Code
                              required: true
                              labelHint: Model Code 创建后不可修改
                            children:
                              - type: Input
                                props:
                                  name: modelCode
                                  className: w-full
                                  placeholder: 小写 + 数字 + 连字符，如 qwen3-vl-plus
                                  disabled: false
                                  rules:
                                    - required: true
                                      message: 请输入 Model Code
                          - type: Field
                            props:
                              label: Model Name
                              required: true
                            children:
                              - type: Input
                                props:
                                  name: displayName
                                  className: w-full
                                  placeholder: 展示名，如 Qwen3-VL Plus
                                  rules:
                                    - required: true
                                      message: 请输入 Model Name
                          - type: Field
                            props:
                              label: Provider
                              required: true
                            children:
                              - type: Select
                                props:
                                  name: primaryProviderCode
                                  className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                                  options: ${data.providerOptions}
                                  rules:
                                    - required: true
                                      message: 请选择 Provider
                          - type: Field
                            props:
                              label: Provider Model Name
                              required: true
                            children:
                              - type: Input
                                props:
                                  name: primaryProviderModelId
                                  className: w-full
                                  placeholder: 上游 API 实际调用的模型 ID
                                  rules:
                                    - required: true
                                      message: 请输入 Provider Model Name
                          - type: Field
                            props:
                              label: Model Type
                              required: true
                            children:
                              - type: Select
                                props:
                                  name: modelType
                                  className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                                  options:
                                    - label: 大语言模型 (LLM)
                                      value: LLM
                                    - label: Embedding
                                      value: Embedding
                                    - label: 文生图 (Image)
                                      value: Image
                                    - label: 音频 (Audio)
                                      value: Audio
                                  rules:
                                    - required: true
                                      message: 请选择 Model Type
                          - type: Field
                            props:
                              label: 发布日期
                            children:
                              - type: Input
                                props:
                                  name: releaseDate
                                  className: w-full
                                  placeholder: YYYY-MM-DD
                          - type: Field
                            props:
                              label: 上下文窗口
                            children:
                              - type: NumberInput
                                props:
                                  name: contextLength
                                  className: w-full
                                  min: 1
                                  precision: 0
                                  placeholder: Token 数，如 256000
                          - type: Field
                            props:
                              label: Max Tokens
                            children:
                              - type: NumberInput
                                props:
                                  name: maxOutputTokens
                                  className: w-full
                                  min: 1
                                  precision: 0
                                  placeholder: 最大输出 Token，如 32000
                          - type: Field
                            props:
                              label: INPUT 模态
                            children:
                              - type: Input
                                props:
                                  name: inputModalities
                                  className: w-full
                                  placeholder: 逗号分隔：text, image, video
                          - type: Field
                            props:
                              label: OUTPUT 模态
                            children:
                              - type: Input
                                props:
                                  name: outputModalities
                                  className: w-full
                                  placeholder: 逗号分隔：text
                          - type: Field
                            props:
                              label: Tags
                            children:
                              - type: Input
                                props:
                                  name: tags
                                  className: w-full
                                  placeholder: 逗号分隔：free, lite, vision
                          - type: Field
                            props:
                              label: Status
                            children:
                              - type: RadioGroup
                                props:
                                  name: status
                                  direction: horizontal
                                  options:
                                    - label: 启用
                                      value: enabled
                                    - label: 停用
                                      value: disabled
                      - type: Field
                        props:
                          label: Description
                          className: mt-4
                        children:
                          - type: Textarea
                            props:
                              name: description
                              className: w-full
                              placeholder: 模型说明（最长 500 字符）
                              rows: 3
                      - type: Field
                        props:
                          label: 元数据 (JSON)
                        children:
                          - type: Textarea
                            props:
                              name: metadata
                              rows: 3
                              className: font-mono w-full
                              placeholder: '{ "key": "value" }'
                  - key: params
                    label: 默认参数
                    className: p-2
                    children:
                      - type: Alert
                        props:
                          showIcon: true
                          variant: info
                          className: mb-4
                          message: 调用时的默认执行参数；客户端可在允许范围内覆盖。max_tokens 默认值不得超过基本信息中的 Max Tokens。
                      - type: Grid
                        props:
                          columns: 2
                          gap: 16
                        children:
                          - type: Field
                            props:
                              label: temperature
                            children:
                              - type: NumberInput
                                props:
                                  name: temperature
                                  className: w-full
                                  min: 0
                                  max: 2
                                  step: 0.1
                                  placeholder: "0.7"
                          - type: Field
                            props:
                              label: top_p
                            children:
                              - type: NumberInput
                                props:
                                  name: topP
                                  className: w-full
                                  min: 0
                                  max: 1
                                  step: 0.05
                                  placeholder: "0.9"
                          - type: Field
                            props:
                              label: top_k
                            children:
                              - type: NumberInput
                                props:
                                  name: topK
                                  className: w-full
                                  min: 0
                                  precision: 0
                                  placeholder: "40"
                          - type: Field
                            props:
                              label: max_tokens
                            children:
                              - type: NumberInput
                                props:
                                  name: maxTokensParam
                                  className: w-full
                                  min: 1
                                  precision: 0
                                  placeholder: "4096"
                          - type: Field
                            props:
                              label: frequency_penalty
                            children:
                              - type: NumberInput
                                props:
                                  name: frequencyPenalty
                                  className: w-full
                                  min: -2
                                  max: 2
                                  step: 0.1
                                  placeholder: "0"
                          - type: Field
                            props:
                              label: presence_penalty
                            children:
                              - type: NumberInput
                                props:
                                  name: presencePenalty
                                  className: w-full
                                  min: -2
                                  max: 2
                                  step: 0.1
                                  placeholder: "0"
                          - type: Field
                            props:
                              label: reasoning_effort
                            children:
                              - type: Select
                                props:
                                  name: reasoningEffort
                                  className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                                  options:
                                    - label: low
                                      value: low
                                    - label: medium
                                      value: medium
                                    - label: high
                                      value: high
                          - type: Field
                            props:
                              label: seed
                            children:
                              - type: NumberInput
                                props:
                                  name: seed
                                  className: w-full
                                  min: 0
                                  precision: 0
                                  placeholder: 留空表示不固定
                          - type: Field
                            props:
                              label: stop_sequences
                            children:
                              - type: Input
                                props:
                                  name: stopSequences
                                  className: w-full
                                  placeholder: JSON 数组，如 ["\n"]
                          - type: Field
                            props:
                              label: response_format
                            children:
                              - type: Select
                                props:
                                  name: responseFormat
                                  className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                                  options:
                                    - label: text
                                      value: text
                                    - label: json_schema
                                      value: json_schema
                      - type: Field
                        props:
                          label: 能力开关
                          className: mt-4
                        children:
                          - type: Input
                            props:
                              name: capabilities
                              className: w-full
                              placeholder: 逗号分隔：Streaming, Tool Calling, Vision
                  - key: pricing
                    label: 定价
                    className: p-2
                    children:
                      - type: Flex
                        props:
                          justify: space-between
                          align: center
                        children:
                          - type: Text
                            props:
                              text: 标准价格：单位 $/1M · 按 input_tokens 分档（最后一行无上限）
                              type: secondary
                              className: text-sm
                          - type: Button
                            props:
                              text: JSON
                              icon: code
                              size: small
                            events:
                              onClick:
                                - action: message
                                  params:
                                    messageType: info
                                    text: JSON 编辑模式：批量编辑 tiers + multipliers 后回表单校验（演示）
                      - type: Flex
                        props:
                          direction: vertical
                          gap: small
                          className: my-4
                        children:
                          - type: Table
                            props:
                              dataSource:
                                - uptoText: "128000"
                                  input: 0.1
                                  output: 0.8
                                  cacheReadText: —
                                  cacheWriteText: —
                                - uptoText: ∞
                                  input: 0.2
                                  output: 1.6
                                  cacheReadText: —
                                  cacheWriteText: —
                              rowKey: uptoText
                              pagination: false
                              columns:
                                - title: UPTO
                                  dataIndex: uptoText
                                - title: INPUT ($/1M)
                                  dataIndex: input
                                - title: OUTPUT ($/1M)
                                  dataIndex: output
                                - title: CACHE READ
                                  dataIndex: cacheReadText
                                - title: CACHE WRITE
                                  dataIndex: cacheWriteText
                          - type: Button
                            props:
                              text: 添加档位
                              icon: plus
                              size: small
                            events:
                              onClick:
                                - action: message
                                  params:
                                    messageType: info
                                    text: 添加价格档位（演示：UPTO 需严格递增，末行为无上限档）
                      - type: Text
                        props:
                          text: 时段倍率
                          strong: true
                          className: mt-4
                      - type: Flex
                        props:
                          direction: vertical
                          gap: small
                          className: mt-2
                        children:
                          - type: Text
                            props:
                              text: 未配置时段倍率，全天按标准价格计费
                              type: secondary
                              className: text-sm
                          - type: Button
                            props:
                              text: 添加时段规则
                              icon: plus
                              size: small
                            events:
                              onClick:
                                - action: message
                                  params:
                                    messageType: info
                                    text: 添加时段倍率规则（演示：每天 / 工作日 / 周末 + 起止时间 + 倍率）
                      - type: Alert
                        props:
                          showIcon: true
                          variant: warning
                          className: mt-4
                          message: 修改时段规则后，会重置关联 Route Target 上继承的时段倍率覆盖。
                      - type: Field
                        props:
                          label: Currency
                          className: mt-4 max-w-[50%]
                        children:
                          - type: Select
                            props:
                              name: currency
                              className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                              options:
                                - label: USD
                                  value: USD
                                - label: CNY
                                  value: CNY
        - type: Flex
          props:
            justify: end
            className: mt-4
          children:
            - type: Flex
              props:
                align: center
                gap: middle
              children:
                - type: Button
                  props:
                    text: 取消
                    icon: x
                  events:
                    onClick:
                      - action: navigate
                        params:
                          to: /models
                - type: Button
                  props:
                    text: 保存
                    icon: save
                    variant: primary
                    submit: true
