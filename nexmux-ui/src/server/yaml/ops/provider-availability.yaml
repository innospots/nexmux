dsl: "1.0"
page:
  id: provider-availability
  title: 可靠性
  name: providerAvailability
  description: 运行管理 / 供应商可用性：供应商与路由质量
state:
  range:
    start: 2026-09-22
    end: 2026-09-28
dataSources:
  availability:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/data/ops/provider-availability
      params:
        start: ${state.range.start}
        end: ${state.range.end}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 运行管理
          - label: 供应商可用性
    - type: Flex
      props:
        align: baseline
        gap: middle
      children:
        - type: Typography
          props:
            variant: h3
            text: 可靠性
        - type: Typography
          props:
            variant: muted
            text: 供应商与路由质量
    - type: Card
      children:
        - type: Flex
          props:
            justify: space-between
            align: center
            gap: middle
            style:
              flexWrap: wrap
          children:
            - type: Flex
              props:
                align: center
                gap: middle
              children:
                - type: Text
                  props:
                    text: 时间范围 (UTC)
                    strong: true
                - type: DatePicker
                  props:
                    mode: range
                    value: ${state.range}
                    placeholder: 选择时间范围
                    presets:
                      - label: 今天
                        days: 1
                      - key: thisWeek
                      - key: thisMonth
                      - label: 近3天
                        days: 3
                      - label: 近7天
                        days: 7
                      - label: 近14天
                        days: 14
                      - label: 近30天
                        days: 30
                    style:
                      width: 280
                  events:
                    onChange:
                      - action: setState
                        condition: ${event}
                        params:
                          range: ${event}
                      - action: reload
                        params:
                          dataSource: availability
                        condition: ${event}
    - type: Card
      children:
        - type: Flex
          props:
            justify: space-between
            align: center
          children:
            - type: Typography
              props:
                variant: h4
                text: 供应商质量
        - type: Table
          when: ${data.availability.providers != null &&
            data.availability.providers.length > 0}
          props:
            dataSource: ${data.availability.providers}
            rowKey: key
            loading: ${dataStatus.availability.loading}
            pagination: false
            columns:
              - title: 供应商
                cell:
                  type: Button
                  props:
                    text: ${row.provider}
                    variant: link
                    size: small
                    className: p-0 h-auto font-semibold
                  events:
                    onClick:
                      - action: navigate
                        params:
                          to: /provider-usage
              - title: 请求数
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.requests}
                    className: tabular-nums
              - title: 成功率
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.successRate}
                    className: tabular-nums
              - title: 错误
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.errors}
                    className: tabular-nums
              - title: 平均延迟
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.avgLatency}
                    className: tabular-nums
              - title: 平均上游
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.avgUpstream}
                    className: tabular-nums
              - title: Failover 率
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.failoverRate}
                    className: tabular-nums
              - title: 平均尝试
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.avgAttempts}
                    className: tabular-nums
              - title: 标准
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.standard}
                    className: tabular-nums
              - title: 计费
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.billed}
                    className: tabular-nums
              - title: 成本
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.cost}
                    className: tabular-nums
        - type: Empty
          when: ${data.availability.providers != null &&
            data.availability.providers.length == 0}
          props:
            title: 无数据
    - type: Card
      children:
        - type: Flex
          props:
            justify: space-between
            align: center
          children:
            - type: Typography
              props:
                variant: h4
                text: 按模型对比供应商
        - type: Table
          when: ${data.availability.compare != null && data.availability.compare.length >
            0}
          props:
            dataSource: ${data.availability.compare}
            rowKey: key
            loading: ${dataStatus.availability.loading}
            pagination: false
            columns:
              - title: 模型
                dataIndex: model
              - title: 供应商
                dataIndex: provider
              - title: 请求数
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.requests}
                    className: tabular-nums
              - title: 成功率
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.successRate}
                    className: tabular-nums
              - title: 平均延迟
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.avgLatency}
                    className: tabular-nums
              - title: 平均上游
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.avgUpstream}
                    className: tabular-nums
              - title: Failover 率
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.failoverRate}
                    className: tabular-nums
              - title: 平均尝试
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.avgAttempts}
                    className: tabular-nums
              - title: 标准
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.standard}
                    className: tabular-nums
              - title: 计费
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.billed}
                    className: tabular-nums
              - title: 成本
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.cost}
                    className: tabular-nums
        - type: Empty
          when: ${data.availability.compare != null && data.availability.compare.length ==
            0}
          props:
            title: 无数据
    - type: Card
      children:
        - type: Flex
          props:
            justify: space-between
            align: center
          children:
            - type: Typography
              props:
                variant: h4
                text: 近期错误
            - type: Button
              props:
                text: 查看全部错误日志
                variant: link
                size: small
                className: p-0 h-auto
              events:
                onClick:
                  - action: navigate
                    params:
                      to: /call-logs
        - type: Table
          when: ${data.availability.errors != null && data.availability.errors.length > 0}
          props:
            dataSource: ${data.availability.errors}
            rowKey: id
            loading: ${dataStatus.availability.loading}
            pagination: false
            columns:
              - title: 时间 (UTC)
                dataIndex: time
                width: 160
              - title: 模型 / 供应商
                dataIndex: target
              - title: 错误
                dataIndex: error
        - type: Empty
          when: ${data.availability.errors != null && data.availability.errors.length ==
            0}
          props:
            title: 暂无近期错误
