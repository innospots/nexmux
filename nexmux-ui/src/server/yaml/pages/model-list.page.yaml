dsl: "1.0"
page:
  id: model-list
  title: 模型
  name: modelList
  description: 模型资产 / 模型：对客户端暴露的模型管理（卡片式列表）
state:
  typeChip: all
  prov_dashscope: false
  prov_gemini: false
  prov_openai: false
dataSources:
  models:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/data/models
      params:
        type: ${state.typeChip}
        dashscope: ${state.prov_dashscope}
        gemini: ${state.prov_gemini}
        openai: ${state.prov_openai}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 模型资产
          - label: 模型
    - type: Flex
      props:
        align: baseline
        gap: middle
      children:
        - type: Typography
          props:
            variant: h3
            text: 模型
        - type: Typography
          props:
            variant: muted
            text: 维护对客户端暴露的模型。从目录导入，或新建空白模型。
    - type: Card
      children:
        - type: Flex
          props:
            align: center
            gap: small
            style:
              flexWrap: wrap
          children:
            - type: Text
              props:
                text: 类型
                strong: true
                className: w-10
            - type: ChipNode
              props:
                text: 全部 ${data.models.counts.all.total}
                selected: ${state.typeChip == 'all'}
              events:
                onClick:
                  - action: setState
                    params:
                      typeChip: all
                  - action: reload
                    params:
                      dataSource: models
            - type: ChipNode
              props:
                text: 大语言模型 ${data.models.counts.types.LLM}
                selected: ${state.typeChip == 'LLM'}
              events:
                onClick:
                  - action: setState
                    params:
                      typeChip: "${state.typeChip == 'LLM' ? 'all' : 'LLM'}"
                  - action: reload
                    params:
                      dataSource: models
            - type: ChipNode
              props:
                text: 文生图 ${data.models.counts.types.Image}
                selected: ${state.typeChip == 'Image'}
              events:
                onClick:
                  - action: setState
                    params:
                      typeChip: "${state.typeChip == 'Image' ? 'all' : 'Image'}"
                  - action: reload
                    params:
                      dataSource: models
            - type: ChipNode
              props:
                text: 音频 ${data.models.counts.types.Audio}
                selected: ${state.typeChip == 'Audio'}
              events:
                onClick:
                  - action: setState
                    params:
                      typeChip: "${state.typeChip == 'Audio' ? 'all' : 'Audio'}"
                  - action: reload
                    params:
                      dataSource: models
            - type: ChipNode
              props:
                text: Embedding ${data.models.counts.types.Embedding}
                selected: ${state.typeChip == 'Embedding'}
              events:
                onClick:
                  - action: setState
                    params:
                      typeChip: "${state.typeChip == 'Embedding' ? 'all' : 'Embedding'}"
                  - action: reload
                    params:
                      dataSource: models
        - type: Flex
          props:
            align: center
            gap: small
            style:
              flexWrap: wrap
            className: mt-2
          children:
            - type: Text
              props:
                text: 厂商
                strong: true
                className: w-10
            - type: ChipNode
              props:
                text: 全部 ${data.models.counts.all.total}
                selected: ${!state.prov_dashscope && !state.prov_gemini && !state.prov_openai}
              events:
                onClick:
                  - action: setState
                    params:
                      prov_dashscope: false
                  - action: setState
                    params:
                      prov_gemini: false
                  - action: setState
                    params:
                      prov_openai: false
                  - action: reload
                    params:
                      dataSource: models
            - type: ChipNode
              props:
                text: 阿里云百炼 ${data.models.counts.providers.dashscope}
                selected: ${state.prov_dashscope}
              events:
                onClick:
                  - action: setState
                    params:
                      prov_dashscope: ${!state.prov_dashscope}
                  - action: reload
                    params:
                      dataSource: models
            - type: ChipNode
              props:
                text: Google Gemini ${data.models.counts.providers.gemini}
                selected: ${state.prov_gemini}
              events:
                onClick:
                  - action: setState
                    params:
                      prov_gemini: ${!state.prov_gemini}
                  - action: reload
                    params:
                      dataSource: models
            - type: ChipNode
              props:
                text: OpenAI ${data.models.counts.providers.openai}
                selected: ${state.prov_openai}
              events:
                onClick:
                  - action: setState
                    params:
                      prov_openai: ${!state.prov_openai}
                  - action: reload
                    params:
                      dataSource: models
    - type: Grid
      props:
        columns: 3
        gap: 16
      children:
        - type: Card
          props:
            className: border-dashed h-full bg-(--muted) border-2
              border-[color-mix(in_srgb,var(--foreground)_30%,transparent)]
          children:
            - type: Flex
              props:
                direction: vertical
                gap: large
                align: stretch
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        justify: center
                        className: size-10 shrink-0 rounded-full bg-primary
                      children:
                        - type: Icon
                          props:
                            name: plus
                            size: 28
                            color: var(--primary-foreground)
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 2
                      children:
                        - type: Text
                          props:
                            text: 添加模型
                            strong: true
                            className: text-base
                        - type: Text
                          props:
                            text: 从目录导入，或新建空白模型
                            type: secondary
                            className: text-sm
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Button
                      props:
                        text: 导入
                        icon: download
                        variant: default
                        style:
                          flex: 1
                      events:
                        onClick:
                          - id: importResult
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: 导入模型
                                width: 560
                                content:
                                  type: Form
                                  props:
                                    name: importWizard
                                  events:
                                    onSubmit:
                                      - action: overlay.close
                                        params:
                                          payload:
                                            ok: true
                                  children:
                                    - type: Alert
                                      props:
                                        showIcon: true
                                        variant: info
                                        className: mb-4
                                        message: 从已配置 Provider 的模型目录批量导入：选择 Provider 与模型类型后，从目录勾选模型并批量创建。
                                    - type: Field
                                      props:
                                        label: Provider
                                        required: true
                                      children:
                                        - type: Select
                                          props:
                                            name: provider
                                            options:
                                              - label: 阿里云百炼
                                                value: dashscope
                                              - label: Google Gemini
                                                value: gemini
                                              - label: OpenAI
                                                value: openai
                                            controlClassName: w-full [&_[data-slot=select-trigger]]:w-full
                                            rules:
                                              - required: true
                                                message: 请选择 Provider
                                    - type: Field
                                      props:
                                        label: 模型类型
                                        required: true
                                      children:
                                        - type: Select
                                          props:
                                            name: modelType
                                            value: LLM
                                            options:
                                              - label: 大语言模型
                                                value: LLM
                                              - label: 文生图
                                                value: Image
                                              - label: 音频
                                                value: Audio
                                              - label: Embedding
                                                value: Embedding
                                            controlClassName: w-full [&_[data-slot=select-trigger]]:w-full
                                            rules:
                                              - required: true
                                                message: 请选择模型类型
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: middle
                                      children:
                                        - type: Button
                                          props:
                                            text: 取消
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: 下一步：选择目录模型
                                            variant: primary
                                            submit: true
                          - action: if
                            params:
                              condition: ${actions.importResult.ok}
                              then:
                                - action: message
                                  params:
                                    messageType: success
                                    text: 已创建导入草稿（演示：后续步骤为目录勾选与批量创建）
                    - type: Button
                      props:
                        text: 新建
                        icon: plus
                        variant: primary
                        style:
                          flex: 1
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /models/new
        - type: ModelCardLink
          when: ${data.models.items[0] != null}
          props:
            href: /models/${data.models.items[0].code}
          children:
            - type: Card
              props:
                className: h-full model-card relative
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        justify: center
                        className: size-14 shrink-0 rounded-full bg-(--muted)
                      children:
                        - type: Icon
                          props:
                            name: ${data.models.items[0].providerIcon}
                            size: 28
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 0
                        style:
                          alignItems: flex-start
                          flex: 1
                      children:
                        - type: Button
                          props:
                            text: ${data.models.items[0].name}
                            variant: link
                            className: p-0 font-semibold text-base
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /models/${data.models.items[0].code}
                        - type: Text
                          props:
                            text: ${data.models.items[0].code}
                            type: secondary
                            className: text-sm
                - type: Flex
                  props:
                    align: center
                    gap: 2
                    className: absolute right-3 top-3 model-card-actions
                  children:
                    - type: Tooltip
                      props:
                        content: "${data.models.items[0].status == 'enabled' ? '停用' : '启用'}"
                      children:
                        - type: Button
                          props:
                            variant: text
                            size: small
                            className: size-6 p-0
                          children:
                            - type: StatusToggleIcon
                              props:
                                enabled: ${data.models.items[0].status == 'enabled'}
                          events:
                            onClick:
                              - id: statusCfm
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: "${data.models.items[0].status == 'enabled' ? '确认停用 Model' : '确认启用
                                      Model'}"
                                    width: 480
                                    content:
                                      type: Flex
                                      props:
                                        direction: vertical
                                        gap: middle
                                      children:
                                        - type: Text
                                          props:
                                            size: small
                                            text: "${data.models.items[0].status == 'enabled' ?
                                              '停用后，该模型将不再参与路由调度，客户端通过路由调用该模型将失败\
                                              。' : '启用后，该模型可被路由引用与调度。'}"
                                        - type: Flex
                                          props:
                                            direction: vertical
                                            gap: small
                                          children:
                                            - type: Text
                                              props:
                                                text: 影响范围：
                                                strong: true
                                            - type: Text
                                              props:
                                                text: · 供应商模型绑定：${data.models.items[0].suppliers.length} 个
                                                type: secondary
                                            - type: Text
                                              props:
                                                text: · 路由引用：${data.models.items[0].routes.total}
                                                  条路由（${data.models.items[0].routes.active}
                                                  条活跃）
                                                type: secondary
                                        - type: Text
                                          when: ${data.models.items[0].status == 'enabled' &&
                                            data.models.items[0].routes.active >
                                            0}
                                          props:
                                            size: small
                                            text: ⚠ 存在活跃路由引用时，建议先完成切换再停用。
                                            type: warning
                                        - type: Flex
                                          props:
                                            justify: end
                                            gap: middle
                                          children:
                                            - type: Button
                                              props:
                                                text: 取消
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                            - type: Button
                                              props:
                                                text: "${data.models.items[0].status == 'enabled' ? '确认停用' : '确认启用'}"
                                                variant: primary
                                                danger: ${data.models.items[0].status == 'enabled'}
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                                    params:
                                                      payload:
                                                        ok: true
                              - action: if
                                params:
                                  condition: ${actions.statusCfm.ok}
                                  then:
                                    - action: message
                                      params:
                                        messageType: success
                                        text: "${data.models.items[0].status == 'enabled' ? '已停用' : '已启用'}（演示：静态页面不落库）"
                    - type: Tooltip
                      props:
                        content: 编辑
                      children:
                        - type: Button
                          props:
                            icon: pencil
                            variant: text
                            size: small
                            className: size-6 p-0
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /models/${data.models.items[0].code}/edit
                - type: Flex
                  props:
                    align: center
                    justify: space-between
                  children:
                    - type: Flex
                      props:
                        align: center
                        gap: small
                        className: shrink-0 whitespace-nowrap
                      children:
                        - type: Badge
                          props:
                            text: ${data.models.items[0].type}
                            variant: outline
                        - type: Text
                          props:
                            text: ${data.models.items[0].specSummary}
                            className: tabular-nums
                    - type: Flex
                      props:
                        align: center
                        gap: small
                        className: shrink-0 whitespace-nowrap
                      children:
                        - type: Text
                          props:
                            text: ${data.models.items[0].pricingSummary}
                            className: tabular-nums
                        - type: Badge
                          when: ${data.models.items[0].tierLabel != ''}
                          props:
                            text: ${data.models.items[0].tierLabel}
                            variant: secondary
                - type: Flex
                  props:
                    justify: end
                    align: center
                  children:
                    - type: Button
                      props:
                        text: ${data.models.items[0].routeSummary}
                        variant: link
                        size: small
                        className: p-0 h-auto text-(--muted-foreground)
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /routes
        - type: ModelCardLink
          when: ${data.models.items[1] != null}
          props:
            href: /models/${data.models.items[1].code}
          children:
            - type: Card
              props:
