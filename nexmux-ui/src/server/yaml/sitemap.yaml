# 布局 DSL（PageOutlet 为页面内容出口）。
# 布局 body 内 ${data.session.*} 由客户端注入的 session dataSource 提供
#（user / app / menus）。登录 / 登出是普通 HTTP 调用，DSL 用内置 request
# 动作表达（跨域绝对地址，客户端 httpHooks 自动改写进项目内代理前缀）。
layouts:
  # 管理端外壳（完整对齐 model-console shell.json）：Sidebar（品牌 +
  # SitemapMenu 导航）> Header（ThemeSwitcher 换肤 + 语言 + 用户菜单）+
  # Content（PageOutlet 页面出口）
  admin:
    dsl: "1.0"
    body:
      type: Layout
      props: { className: shell-root }
      children:
        - type: Sidebar
          props:
            className: shell-main
            brand: { title: Model Console, logo: /next.svg }
            collapsible: true
            content:
              type: SitemapMenu
              props:
                items: ${data.session.menus}
                collapsible: true
                className: shell-menu
              events:
                onSelect:
                  - action: navigate
                    params: { to: "${event}" }
          children:
            - type: Header
              props:
                className: shell-header
                locales:
                  - { label: 中文, value: zh-CN }
                  - { label: English, value: en-US }
                user:
                  name: ${data.session.user.name}
                  items:
                    - { label: 个人中心, value: profile, icon: user }
                    - { label: 退出登录, value: logout, icon: log-out }
              events:
                onUserSelect:
                  - action: if
                    params:
                      condition: ${event == 'logout'}
                      then:
                        - action: util.request
                          params:
                            method: POST
                            url: /api/auth/logout
                        - action: app.reload
                          params: { to: /login }
                      else:
                        - action: message
                          params:
                            messageType: info
                            text: 个人中心暂未开放（账号体系由平台侧统一管理）
                onLocaleChange:
                  - action: message
                    params:
                      messageType: info
                      text: 语言切换为 ${event}（演示：应用层桥接后整页生效）
              children:
                - type: ThemeSwitcher
            - type: Content
              props: { className: shell-content }
              children:
                - type: PageOutlet
  # 登录页外壳：login-page 全屏渐变容器（model-console 中由宿主 div 提供，
  # 此处由布局承担），样式见 app/login.css
  login:
    dsl: "1.0"
    body:
      type: Flex
      props:
        className: login-page
      children:
        - type: PageOutlet
  # 裸布局：无外壳，页面铺满
  blank:
    dsl: "1.0"
    body:
      type: PageOutlet
